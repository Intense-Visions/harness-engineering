### REVIEW

**1. Select the tier (computed, not asked).** The phase diff runs from `{base}` to `{head}`: `{base}` is the `diff.head` of the receipt of the nearest earlier phase that has one, passing over a phase that was skipped or whose review wrote no receipt, and `startingCommit` when no earlier phase has a receipt (as for the first phase); `{head}` is `git rev-parse HEAD`. Both are resolved 40-character SHAs. A commit made between two reviewed phases, or by a phase that was never reviewed, is therefore inside the next phase's diff. The gate recomputes this base from the same files: a phase receipt whose `diff.base` is not it fails `PHASE_BASE_MISMATCH`, and when no base can be named (no earlier receipt and no `startingCommit`, or an earlier receipt it cannot read) it fails `PHASE_BASE_UNKNOWN`. After a fix the base stays and `{head}` is the new HEAD. Run `harness review-tier --base {base} --head {head} --complexity {complexity} --rigor {rigorLevel}` (`{complexity}` is the phase's assessed complexity; add `--pipeline-runner` when the `run_code_review` tool is callable in this session; `--json` prints the result as JSON) and use its output: the tier, its reasons and the backend. The command runs git from the repository top level and reads `review.backend` from the `harness.config.json` at that top level (a `harness.config.json` in a subdirectory, such as an example project's, is not read), so it prints the same tier and backend from any directory of the repository. It gathers the diff, every commit message of `{base}..{head}` and the package entry points itself and applies `selectReviewTier` (from `@harness-engineering/core`). A diff larger than git's output buffer gives `full` with the reason `diff-too-large`, never `light` and never an error. If the command exits non-zero, it could not compute a tier (an unresolvable `{base}` or `{head}`, a range git cannot list): do not assume `light`; fix the range and run it again. The rules below describe what the command computes; apply them by hand only when the CLI is unavailable. The phase is `full` when any of these holds, and `light` otherwise:

- the diff, a changed path or any commit message of the range matches at least one risk keyword (harness-code-review `references/risk-keywords.md`). The diff's content is read as text whatever git attributes say, so a file marked `-diff` or `binary` cannot hide a keyword. The command decides which commit-message trailers are left out of the match: identity trailers only, as harness-code-review "Review tier and dispatch" states the rule. Any other trailer is matched like the rest of the message, so a closing `Security: the token check now runs first` line still makes the phase `full`;
- the diff touches a package entry point: `src/index.ts` at a package root, or a file named in a `package.json` `exports`, `main` or `bin` field (a moved or renamed entry point counts, because its old path is in the diff);
- the phase's assessed complexity is `high`;
- `rigorLevel` is `thorough`.

Print the command's `Review tier:` line, for example `Review tier: full (risk-keyword:token, complexity:high)`.

**2. Resolve the backend.** Use the `Review backend:` line of the same command: it reads `review.backend` from the repository top's `harness.config.json`, or from the file the global `-c` option names (default `"agent"`; any other value is an error, exit 1) and resolves it (`resolveReviewBackend`). `"pipeline"` applies to a `full` review only: a `light` review always resolves to the agent backend, a rule `resolveReviewBackend` holds in core, so every caller gets the same answer. For a `full` review the pipeline is used only when the `run_code_review` tool is callable in this session, which the command learns from `--pipeline-runner`; otherwise it prints `agent`, marked `DEGRADED` when the pipeline was configured and no runner resolved: run the agent backend and record `backend: "agent"` in the receipt. When the CLI is unavailable, read the key and apply this rule by hand.

**3. Run the review from this session; do not hand the whole skill to one subagent.** A dispatched reviewer has no way to dispatch reviewers of its own, so the fan-out is issued here. Create `{sessionDir}/reviews/phase-{N}/`, where `{N}` is `currentPhase`, the phase's 0-based position (`phase-0` for the first phase). If it already holds a `receipt.json`, this review runs after a fix and rewrites it (Review records, After a fix). Who writes which file is the one rule in Review records, Who writes what.

- **`light`:** one dispatch.

  ```
  subagent_type: "harness-code-reviewer"
  prompt: "Phase {N}: {name}. Session: {sessionSlug}. Follow harness-code-review in dispatched mode: review-dir {sessionDir}/reviews/phase-{N}/, moment phase, tier light, head {head}. Diff: git diff {base}..{head}. Run its Phase 2 (MECHANICAL) and Phase 3 (CONTEXT) yourself, then the compliance and bug-detection passes. Classify every critical or important finding per harness-code-review references/attribution-rubric.md (findingClass, escapedFrom). Write only your findings file, {sessionDir}/reviews/phase-{N}/compliance-bug.json, as { schemaVersion: 1, reviewerId: \"compliance-bug\", head: \"{head}\", examinedFiles, findings }, where examinedFiles lists only files that git diff --name-only --no-renames -z {base}..{head} prints and that you read, and every finding id starts with compliance-bug-. Before you return, run harness check-review-receipt --findings {sessionDir}/reviews/phase-{N}/compliance-bug.json --base {base} --head {head}, correct what it reports until it prints PASS, and state its result. If your Phase 2 fails (harness validate, typecheck or tests), write no findings file and return a report whose first line is MECHANICAL FAILED, followed by each failing check. Write no receipt.json and run no receipt gate: the dispatching session does. Report findings (critical / important / suggestion)."
  ```

- **`full`, agent backend:** run harness-code-review Phase 2 (MECHANICAL), Phase 3 (CONTEXT) and Phase 3.5 (CALIBRATE DEPTH) in this session. Then issue one dispatch per reviewer, in parallel: `compliance`, `bug`, `security`, `architecture`, plus each conditional reviewer the calibration activates (`adversarial`, `typescript-strict`, `frontend-races`).

  ```
  subagent_type: "<reviewer persona>"
  prompt: "Phase {N}: {name}. Session: {sessionSlug}. You are the {reviewerId} reviewer ONLY (harness-code-review Phase 4, the {reviewerId} section). Review-dir {sessionDir}/reviews/phase-{N}/, moment phase, head {head}. Diff: git diff {base}..{head}. Context: {reviewer context bundle}. Classify every critical or important finding per harness-code-review references/attribution-rubric.md (findingClass, escapedFrom). Write only {sessionDir}/reviews/phase-{N}/{reviewerId}.json as { schemaVersion: 1, reviewerId, head: \"{head}\", examinedFiles, findings }, where head is the commit you read, examinedFiles lists only files that git diff --name-only --no-renames -z {base}..{head} prints and that you read, and every finding id starts with {reviewerId}-. Before you return, run harness check-review-receipt --findings {sessionDir}/reviews/phase-{N}/{reviewerId}.json --base {base} --head {head}, correct what it reports until it prints PASS, and state its result. Run no mechanical check and write no receipt.json. Report findings (critical / important / suggestion)."
  ```

  Personas: `harness-code-reviewer` for `compliance`, `bug` and `architecture`; `harness-security-reviewer` for `security`; `harness-adversarial-reviewer`, `harness-typescript-strict-reviewer` and `harness-frontend-races-reviewer` for the conditional reviewers.

- **`full`, pipeline backend:** call `run_code_review` with the phase diff, then write one findings file per reviewer from its findings, as harness-code-review "Review tier and dispatch" describes (every page of findings, grouped by `domain` and `subagent`, with the attribution labels set here).

- **This session has no subagent-spawning tool:** it cannot fan out. Run harness-code-review's single-context `light` review in this session (its mechanical and context phases included, then the compliance and bug-detection passes), write `compliance-bug.json` with `head` set to `{head}`, validate it with the same self-check (`harness check-review-receipt --findings {file} --base {base} --head {head}`), and record `tier: "light"` whatever step 1 computed. This is not dispatched mode: nothing dispatched this session, and it writes the receipt itself in step 4. Never record `full` for a review whose reviewers did not each run in their own dispatch.

When it dispatches reviewers, this session prepares context, issues the dispatches and collects the files. It writes no finding of its own and never writes a dispatched reviewer's findings file: a reviewer that returned no file, and did not report a failed mechanical phase, is `ran: false`.

**If the mechanical phase fails, there is no review to gate.** harness-code-review Phase 2 ends the review when `harness validate`, the typecheck or the tests fail. That is a red check, not a failed receipt gate and not a finding to override. It reaches this session three ways, and the rule is the same for all of them:

- `full`, agent backend, or a session with no subagent-spawning tool: this session ran Phase 2 and saw the failure itself. Dispatch no reviewer.
- `light`, dispatched: the reviewer ran Phase 2, wrote no findings file and returned a report whose first line is `MECHANICAL FAILED`, with each failing check. Do not record it as `ran: false`.
- `full`, pipeline backend: `run_code_review` reported `stoppedByMechanical`.

_Pause point (gate): resolve per the Pause Protocol._ <!-- pause: gate -->
In every case write no `receipt.json` and do not run `harness check-review-receipt`: there is no gate failure to override, so `override` is not offered. Report each failing check with its output and ask "fix / stop." `fix`: re-enter EXECUTE with the failing checks as the work; REVIEW then starts again at step 1. `stop`: save state and exit.

Then run harness-code-review Phase 5 (VALIDATE) and Phase 6 (DEDUP + MERGE) over the union of the reviewer files. They decide what this session proposes and never edit a reviewer file.

**4. Write the receipt** to `{sessionDir}/reviews/phase-{N}/receipt.json` (fields and an example: harness-code-review, "Review Receipt"). Set `moment: "phase"`, the tier and backend from steps 1 and 2, `diff.base` and `diff.head` as resolved 40-character SHAs, `coldContext: true` and `priorFindingsSupplied: false` (no reviewer brief above carries findings from an earlier review), the `blocking` and `advisory` counts over the reviewer findings files as written (every finding once: `critical` and `important` are blocking, `suggestion` is advisory, nothing is merged by location; the gate recounts them and fails on a mismatch), and one record per reviewer: `required: true` for every reviewer the tier and the activation set call for, `ran: true` only when its findings file exists, `findingsPath` relative to the receipt directory. List a conditional reviewer the calibration left inactive with `required: false`, `ran: false` and a `skippedReason`. A reviewer whose dispatch failed is `required: true`, `ran: false`: the gate then fails and names it. A `light` receipt lists exactly one required reviewer and its id is `compliance-bug`; any other roster fails `LIGHT_TIER_ROSTER`. Every reviewer id is one of the known reviewers (the core four, the three conditional reviewers, `compliance-bug`); any other id fails `UNKNOWN_REVIEWER`. A hook file (`hook-<hook name>.json`, below) is never a reviewer record and its findings are never in these counts.

**5. Run each effective `after:REVIEW` hook.** This step belongs to REVIEW only: FINAL_REVIEW does not run it and runs its own `after:FINAL_REVIEW` hooks instead. Probe canary once (`canary_probe`; `status: "available"` ⇒ present), determine which of the four detectors are installed, and resolve `resolveReviewHooksWithCanary(config, "harness-autopilot", "after:REVIEW", { canaryPresent, availableSkills })` (from `@harness-engineering/core`). This returns the project's configured `skillHooks` (default none) followed by canary's **installed** deterministic detectors when canary is present — see "Canary detectors auto-wire" under Lifecycle skill hooks. When canary is absent it returns exactly the configured hooks (no regression). Run each hook in order by kind (see Lifecycle skill hooks): a `skill` hook is dispatched as an extra reviewer, a `command` hook runs via the command-runner, a `prompt` hook appends its text to the review brief. For a `skill` hook:

**Also resolve craft's advisory domains at this moment.** Call
`resolveReviewHooksWithCraft(config, "harness-autopilot", "after:REVIEW", { changedFiles, availableSkills })`
and `planCraftReviewDomains("harness-autopilot", "after:REVIEW", changedFiles, availableSkills)` —
see "Craft domains auto-wire" under Lifecycle skill hooks. Dispatch each wired domain as an extra
reviewer with its own `plan.files[skill]` **resolved to absolute paths**, plus a `promptBudget`
where that domain's MCP tool accepts one (`mcp__harness__design_craft` does not), and
merge its findings as **non-blocking** advisory output that does not count toward severity. Record
which domains wired; they are the `alreadyRanFor` input at FINAL_REVIEW.

```
subagent_type: "<hook skill name>"
prompt: "Phase {N}: {name}. Session: {sessionSlug}. Domain review. Context: {hook context}. Report findings (critical / important / suggestion)."
```

_Pause point (gate): resolve per the Pause Protocol._ <!-- pause: gate -->
If a **user-declared** hooked skill cannot be dispatched (typo / not installed), or a `command` hook cannot be spawned (missing binary), do **not** skip it silently and do **not** offer it as an overridable finding: record it in `.harness/failures.md`, set the review status to failed, and halt REVIEW with "cannot verify" — a **hard halt** (see Lifecycle skill hooks, above). (A `command` that RAN and exited non-zero is instead a normal finding, blocking per policy — not a hard halt.) A **harness-default canary detector** that is not installed is the exception: it was already filtered out by `resolveReviewHooksWithCanary` (forward-wired, graceful skip) and is recorded as skipped in the denominator, never a hard halt. Persist each hook's findings as `{sessionDir}/reviews/phase-{N}/hook-<hook name>.json` so provenance survives. A hook file is not a reviewer findings file: the receipt does not list it and does not count it (Review records, Hook findings). Its findings still block per the hook's own policy: add them to the fix / override decision below, beside the validated reviewer findings. Report the detector denominator (how many hooks ran of how many were expected, and how many were skipped-not-installed) so a partial or forward-wired run is never presented as complete. Report the craft denominator in the same breath ("craft domains: N/M activated, K skipped: <reasons>") — a not-installed or unsupported-language craft domain is a graceful skip recorded in the denominator, never a hard halt and never a blocking finding.

**6. Gate the receipt.** Run `harness check-review-receipt {sessionDir}/reviews/phase-{N}` (or the `check_review_receipt` tool; decide on its `pass` field alone, as harness-code-review "Review Receipt" describes: `failures` is absent on a pass, one object for one failure and a list for several). The review directory decides the moment, and nothing a caller passes changes it: `phase-{N}` is a phase review and `final-all` is the final review. A receipt whose `moment` says otherwise fails `MOMENT_MISMATCH`. Pass no `--moment` flag and no `moment` argument for a session review directory: one that agrees with the directory changes nothing, and one that disagrees fails `MOMENT_MISMATCH` (`the receipt directory is the phase review, but --moment says final; the directory decides`). The flag exists for a receipt in a directory that states no moment, such as a copy made elsewhere, which fails `MOMENT_UNKNOWN` without it. A missing receipt fails the gate, as does a required reviewer that did not run, a reviewer id that is not a known reviewer (`UNKNOWN_REVIEWER`), a `light` roster other than the single reviewer `compliance-bug`, a findings file that is absent, invalid, outside the diff or written at another head (`FINDINGS_HEAD_MISMATCH`), a finding id used twice, `blocking` or `advisory` counts that differ from the findings files, a `diff.base` that is not an ancestor of the head or is not the phase base of step 1 (`PHASE_BASE_MISMATCH`, `PHASE_BASE_UNKNOWN`), a HEAD that moved after the review, and tracked files that differ from HEAD (`WORKTREE_DIRTY`). Every code is listed in harness-code-review, "Review Receipt".

_Pause point (gate): resolve per the Pause Protocol._ <!-- pause: gate -->
If the receipt gate fails, REVIEW may not be left. Report each failure and the reviewer it names, then ask "re-run / override / stop." `re-run`: at an unchanged HEAD, dispatch the named reviewers again, rewrite the receipt and gate it again; if HEAD has moved, every required reviewer runs again at the new head (Review records, After a fix). `override`: record the override in `decisions[]` (Review records, Overrides) with every failure code the gate raised. `stop`: save state and exit.

**7. Decide on the blocking findings** that remain: the validated reviewer findings, plus the blocking hook findings of step 5.

_Pause point (gate): resolve per the Pause Protocol._ <!-- pause: gate -->
No blocking (across baseline + additional reviewers) → PHASE_COMPLETE. Blocking → ask "fix / override / stop." `fix`: re-enter EXECUTE; the review that follows runs at the new head (Review records, After a fix). `override`: record the override in `decisions[]` (Review records, Overrides) → PHASE_COMPLETE. REVIEW is never left with a blocking finding of a reviewer file that was neither sent to fix nor covered by that override.

All review output for the phase lives in `{sessionDir}/reviews/phase-{N}/`. The older shapes (`{sessionDir}/phase-{N}-review.json`, `phase-{N}-review-round-{M}.json`) are never written. No code reads them; their one reader is the labelling step of FINAL_REVIEW in this skill, when it resumes an older session.

---

### PHASE_COMPLETE

1. Present summary: name, tasks completed, retries used, verification result, integration report (`{sessionDir}/phase-{N}-integration.json`), review findings count, elapsed time.
2. Record in `history[]`: phase index, name, startedAt, completedAt, tasksCompleted, retriesUsed, verificationPassed, integrationPassed, reviewFindings.
3. Mark phase `complete` in state. Clear scratchpad: `clearScratchpad({ session, phase, projectPath })`.
4. Sync roadmap: `manage_roadmap sync apply:true` (skip if no roadmap; never `force_sync: true`).
5. Write session summary: `writeSessionSummary(projectPath, sessionSlug, { session, lastActive, skill: "harness-autopilot", phase, status, spec, plan, keyContext, nextStep })`.
   _Pause point (ceremony): resolve per the Pause Protocol._ <!-- pause: ceremony -->
6. More phases: "Phase {N} complete. Next: {N+1}: {name} ({complexity}). Continue? (yes / stop)." `yes` → increment `currentPhase`, reset `retryBudget`, → ASSESS. `stop` → save and exit.
7. No more phases: → FINAL_REVIEW.

---

### FINAL_REVIEW

1. Set `currentState: "FINAL_REVIEW"`, `finalReview.status: "in_progress"`.
2. Resolve the cold diff with the command the gate shares its resolver with: `harness review-tier --moment final --session {sessionSlug}` (add `--pipeline-runner` when the `run_code_review` tool is callable in this session, and `--json` for JSON). Take `{base}` and `{head}` from its output and from nothing else: the `Review base:` line names the base and its source, `Review base: <sha> (merge-base; …)` or `Review base: <sha> (starting-commit; …)` (`base` and `baseSource` in JSON), and `{head}` is the commit it was computed at, `HEAD` resolved (`head` in JSON). Record that base as `diff.base`, and when the source is `starting-commit` also record `diff.baseSource: "starting-commit"`. The gate demands exactly this base: the default-branch merge base whenever one resolves (any other base fails `FINAL_BASE_NOT_MERGE_BASE`, whatever `baseSource` says), and the session's starting commit only when none resolves. It accepts `baseSource: "starting-commit"` only when no default-branch merge base resolves AND `diff.base` is the `startingCommit` of this session's `autopilot-state.json`: another base fails `FINAL_BASE_NOT_MERGE_BASE`, and a receipt whose session records no full `startingCommit` fails `STARTING_COMMIT_UNKNOWN`. Never pick a base by hand. When the command prints `Review base: unresolved (<why>)` (`baseUnresolved` in JSON) no base the gate would accept is known: fix what the reason names (pass `--session`, give a valid session name, resolve the head) and run it again. The merge base is taken from this clone's remote-tracking refs as they stand: the gate does not fetch, and those refs are only as trustworthy as the session that could rewrite them. After a fix run the command again at the new head; the base is the merge base again. At every moment the gate also requires `diff.base` to be an ancestor of `diff.head` (`DIFF_BASE_NOT_ANCESTOR`).
3. Run a **cold, `full`** review from this session. The final review is always `full`: `--fast` does not lower it, and the tier is not recomputed here (the command of step 2 prints `full` whatever the rigor, and the backend on its `Review backend:` line). Follow REVIEW step 2 (backend), step 3 (run the review, including what to do when the mechanical phase fails) and step 4 (write the receipt), and no other REVIEW step: REVIEW step 5, the `after:REVIEW` hooks, is not run here, and the gate and the hooks of the final review are written out below. The differences in steps 2 to 4:
   - the review directory is `{sessionDir}/reviews/final-all/`; when it already holds a `receipt.json`, this review runs after a fix and rewrites it (Review records, After a fix);
   - every reviewer brief carries the cold diff and that reviewer's context bundle, and nothing from earlier reviews: no prior findings, no per-phase summary, no coherence-only focus. Each reviewer does the full hunt of its domain over the whole diff;
   - the receipt records `moment: "final"`, `tier: "full"`, `coldContext: true`, `priorFindingsSupplied: false`. These are claims about what was done, not settings: if any brief did carry earlier findings, record `priorFindingsSupplied: true` and `coldContext: false`, and the gate fails;
   - a session with no subagent-spawning tool cannot produce a `full` review. It records `tier: "light"` as REVIEW step 3 says, the final gate fails (`FINAL_NOT_FULL`), and the gate stop below applies. It never records `full`;
   - a failed mechanical phase is handled as REVIEW step 3 says: no reviewer, no receipt, no gate override, and the question "fix / stop", where `fix` dispatches harness-task-executor as step 5 below does and counts against the same fix budget.

   ```
   subagent_type: "<reviewer persona>"
   prompt: "Final review. You are the {reviewerId} reviewer ONLY (harness-code-review Phase 4, the {reviewerId} section). Review-dir {sessionDir}/reviews/final-all/, moment final, head {head}. Diff: git diff {base}..{head}. Context: {reviewer context bundle}. Classify every critical or important finding per harness-code-review references/attribution-rubric.md (findingClass, escapedFrom). Write only {sessionDir}/reviews/final-all/{reviewerId}.json as { schemaVersion: 1, reviewerId, head: \"{head}\", examinedFiles, findings }, where head is the commit you read, examinedFiles lists only files that git diff --name-only --no-renames -z {base}..{head} prints and that you read, and every finding id starts with {reviewerId}-. Before you return, run harness check-review-receipt --findings {sessionDir}/reviews/final-all/{reviewerId}.json --base {base} --head {head}, correct what it reports until it prints PASS, and state its result. Run no mechanical check and write no receipt.json. Report findings (critical / important / suggestion)."
   ```

   Personas, as at REVIEW: `harness-code-reviewer` for `compliance`, `bug` and `architecture`; `harness-security-reviewer` for `security`; `harness-adversarial-reviewer`, `harness-typescript-strict-reviewer` and `harness-frontend-races-reviewer` for the conditional reviewers the calibration activates. These baseline reviewers always run; the `after:FINAL_REVIEW` hooks below run alongside them and never replace them.

   After every reviewer has returned, and not before, read the per-phase findings (`{sessionDir}/reviews/phase-*/`, or the older `{sessionDir}/phase-{N}-review.json` shapes in an older session) and mark each final finding whose file and start line match a per-phase finding as `previously-raised` in `finalReview.findings`. The label is bookkeeping: it never removes a finding or lowers its severity.

   Gate the receipt: `harness check-review-receipt {sessionDir}/reviews/final-all` (or the `check_review_receipt` tool; decide on its `pass` field alone). The directory `final-all` decides the moment: it is the final review, so a receipt there that says `phase` fails `MOMENT_MISMATCH`, and so does passing `--moment phase` (or the tool's `moment: "phase"`) for it. No flag makes a receipt in `final-all` anything but a final receipt. For a final review the gate also fails unless `tier` is `full`, `coldContext` is true and `priorFindingsSupplied` is false, it fails unless `diff.base` is the base of step 2 (`FINAL_BASE_NOT_MERGE_BASE`, `STARTING_COMMIT_UNKNOWN`), and it fails when HEAD moved after the review.

   _Pause point (gate): resolve per the Pause Protocol._ <!-- pause: gate -->

   If the receipt gate fails, FINAL_REVIEW may not be left. Report each failure and the reviewer it names, then ask "re-run / override / stop." `re-run`: at an unchanged HEAD, dispatch the named reviewers again, rewrite the receipt and gate it again; if HEAD has moved, every required reviewer runs again at the new head (Review records, After a fix). `override`: record the override in `decisions[]` (Review records, Overrides) with every failure code the gate raised. `stop`: save state and exit.

   Then run **each effective `after:FINAL_REVIEW` hook** — `resolveReviewHooksWithCanary(config, "harness-autopilot", "after:FINAL_REVIEW", { canaryPresent, availableSkills })` (configured `skillHooks` plus canary's **installed** deterministic detectors when canary is present; exactly the configured hooks when absent) — over the same `{base}..{head}` diff. Run each by kind; a `skill` hook is dispatched as an extra reviewer:

   Resolve craft's advisory domains here too:
   `resolveReviewHooksWithCraft(config, "harness-autopilot", "after:FINAL_REVIEW", { changedFiles, availableSkills, alreadyRanFor })`.
   `alreadyRanFor` is the set of craft domains wired at this phase's `after:REVIEW` **when the
   changed-file set is unchanged** — craft resolves once per phase per diff, and the budget is
   per-resolution, so omitting it lets the same code be critiqued twice. Domains passed this way are
   reported `already-run` in the denominator, not silently absent. If the final diff differs
   from the REVIEW diff, pass nothing. Craft findings merge into `finalReview.findings` as
   **non-blocking advisory** output and never set the final-review status to failed.

   ```
   subagent_type: "<hook skill name>"
   prompt: "Final domain review. Diff: git diff {base}..{head}. Session: {sessionSlug}. Context: {hook context}. Report findings (critical / important / suggestion)."
   ```

   _Pause point (gate): resolve per the Pause Protocol._ <!-- pause: gate -->

   An unresolvable **user-declared** hooked skill (a typo, a not-installed declared skill) or an un-spawnable `command` hook is a FINAL_REVIEW failure, not a skip, and not an overridable finding — record it in `.harness/failures.md`, set the final-review status to failed, and hard-halt with "cannot verify" rather than reporting a green final review that silently dropped a configured hook. A harness-default canary detector that is not installed is instead forward-wired: `resolveReviewHooksWithCanary` already filtered it out, so it is a graceful skip recorded in the denominator, never a FINAL_REVIEW failure. (A `command` that ran and exited non-zero is a normal blocking finding, not a hard halt.) Hook findings are written to `{sessionDir}/reviews/final-all/hook-<hook name>.json` and merge into the same `finalReview.findings` aggregation; they are not reviewer findings files and are not in the receipt's counts (Review records, Hook findings). Report the detector denominator (including skipped-not-installed) so a partial or forward-wired run is never presented as complete.

4. No blocking (across baseline + additional reviewers): store the findings in `finalReview.findings`, set `finalReview.status: "passed"` → OUTCOME_EVAL.

   _Pause point (gate): resolve per the Pause Protocol._ <!-- pause: gate -->

5. Blocking: ask "fix / override / stop."
   - `fix`: increment `finalReview.retryCount`. Dispatch harness-task-executor: "Fix these blocking findings: {findings with file, line, title}. Session: {sessionSlug}. Commit each fix atomically." Run `harness validate`. Re-run FINAL_REVIEW from step 1 at the new head (Review records, After a fix): every reviewer runs again.
   - `override`: record the override in `decisions[]` (Review records, Overrides). Set `"overridden"` → OUTCOME_EVAL.
   - `stop`: save state and exit (resumable).

   **One fix budget.** `finalReview.retryCount` counts every `fix` taken at FINAL_REVIEW and every `fix` taken at OUTCOME_EVAL, in one counter that is never reset: three fix attempts in total for the ship boundary, however many review rounds they produce. When it already stands at 3, `fix` is no longer offered at either state: record the exhaustion in `.harness/failures.md`, report that the budget is spent, and offer "override / stop" only. An exhausted budget changes nothing else. It does not lower a finding's severity, it does not skip the final review of the commits already made.

6. **Any commit after the final review returns here.** The final receipt is for one commit, its `diff.head`. A commit made after it (a final-review fix, an OUTCOME_EVAL fix, a fix for a hook finding, a commit made by hand) has been read by no final review. Return to step 1 and run the final review again at the new head before OUTCOME_EVAL is entered or re-entered. DONE checks this once more before the PR.

---

### OUTCOME_EVAL

The blocking post-execution **spec-satisfaction gate** — the harness's ship gate. It fires ONCE per session, after FINAL_REVIEW and before DONE, judging the WHOLE change against the spec. (It runs at the ship boundary, not per phase: a per-phase judgment would spuriously fail while later phases are still outstanding.) It runs at every rigor level — the gate is not weakened by `--fast`.

1. Set `currentState: "OUTCOME_EVAL"`.
2. **Gather the evidence (required).** Capture the cumulative change as a unified diff: `git diff {startingCommit}..HEAD`. Capture the most recent test-runner output retained from VERIFY; if none is retained, re-run the project test command and capture stdout+stderr. Resolve the head sha via `git rev-parse HEAD`.
3. **Invoke the gate.** Call the `outcome_eval` MCP tool:

   ```json
   {
     "specPath": "<spec path>",
     "diff": "<git diff {startingCommit}..HEAD>",
     "testOutput": "<captured test output>",
     "commit": "<git rev-parse HEAD>"
   }
   ```

   Supplying real `diff` and `testOutput` is mandatory — omitting them degrades the verdict to INCONCLUSIVE/advisory, a silent false-negative that defeats the gate. The tool persists the verdict as an `execution_outcome` node (keyed by `commit`) and returns `verdict`, `confidence`, `judgedAgainst`, `rationale`, `unmetCriteria`, and the TS-derived `authority`.

4. **Honor the TS-derived authority — never the LLM.** `authority` is computed in TypeScript from `(verdict, confidence)`; read it, never recompute or override it.
   - `authority === "advisory"` (all `SATISFIED`, all `INCONCLUSIVE`, and every `medium`/`low` `NOT_SATISFIED`): record the verdict in `finalReview` and proceed → DONE. An advisory `NOT_SATISFIED` is surfaced for human attention but does not halt.
     _Pause point (gate): resolve per the Pause Protocol._ <!-- pause: gate -->
   - `authority === "blocking"` (a high-confidence `NOT_SATISFIED`, and ONLY that): HALT before DONE. Report `unmetCriteria` and ask "fix / override / stop."
     - `fix`: increment `finalReview.retryCount`, the one fix budget FINAL_REVIEW step 5 describes (three attempts shared by both states; when it is spent, `fix` is not offered here and the choices are `override` and `stop`). Dispatch harness-task-executor to address the unmet criteria and run `harness validate`. The fix is a commit no final review has read, so return to FINAL_REVIEW step 1 (a review at the new head) and re-enter OUTCOME_EVAL only after that review's gate passes.
     - `override`: record the rationale in `decisions[]` — the audit trail for shipping over a blocking verdict → DONE.
     - `stop`: save state and exit (resumable).
5. **Never block on infrastructure noise.** A provider failure, a missing/unjudgable spec, or an absent `ANTHROPIC_API_KEY` degrades to `INCONCLUSIVE`/advisory and proceeds — surface the degradation to the human, but do not halt.

---

### DONE

1. Present: total phases, tasks, retries, time, `finalReview.status` (`passed` or `overridden`) + findings count, every override (the override decisions of each phase review and of the final review, with their reasons), and the OUTCOME_EVAL verdict (`verdict` / `confidence` / `authority`, plus any recorded override).
2. **Auto-decision summary (SC11).** If `.harness/sessions/<session-slug>/auto-decisions.jsonl` does not exist, print nothing. Otherwise run `harness autonomy log --session <session-slug>`. If its output contains a line starting `No auto-decisions recorded`, print nothing more; otherwise print the output verbatim. If the command fails or is not recognised, print `Auto-decision summary unavailable (<reason>); raw log: .harness/sessions/<session-slug>/auto-decisions.jsonl` and never report zero decisions you did not read.

   _Pause point (gate): resolve per the Pause Protocol._ <!-- pause: gate -->

3. **Commits after the final review.** Read `diff.head` from `{sessionDir}/reviews/final-all/receipt.json` and run `git rev-list --count <that head>..HEAD`. `0`: go on. Anything else: the branch holds commits no final review read. Report the count and ask "re-review / ship unreviewed / stop." `re-review`: return to FINAL_REVIEW step 1. `ship unreviewed`: record the choice in `decisions[]` (state `DONE`) and go on, and name the unreviewed commits in the PR body. `stop`: save state and exit. This skill makes no commit of its own in DONE: steps 5 to 7 write the handoff, the learnings and the session summary, and may change the roadmap. If any of that is committed to the PR branch, it is a commit no final review read: report it to the human.

   _Pause point (irreversible): resolve per the Pause Protocol._ <!-- pause: irreversible -->

4. Ask "Create a PR? (yes / no)." When creating the PR, include a bare closing line `Closes #<N>` where `<N>` is the issue number from the roadmap row's `External-ID`. The keyword MUST sit IMMEDIATELY before the ref — no intervening words (`Closes #<N>`, never `Closes roadmap #<N>`), or GitHub will not link/close the issue and roadmap auto-done will skip the row.
5. Write final handoff to `{sessionDir}/handoff.json`. Append learnings to `.harness/learnings.md`. Call `promoteSessionLearnings(projectPath, sessionSlug)`. If learnings count > 30, suggest `harness learnings prune`.
6. If `docs/roadmap.md` exists: call `manage_roadmap update` to set feature done. Skip if not found.
7. Write final `writeSessionSummary()`. Set `currentState: "DONE"` in autopilot-state.json.

