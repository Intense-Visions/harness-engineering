## Rigor Levels

Set at INIT (`--fast` / `--thorough`); persists for session. Default: `standard`.

| State        | `fast`                          | `standard`            | `thorough`                      |
| ------------ | ------------------------------- | --------------------- | ------------------------------- |
| PLAN         | Skip skeleton pass              | Default               | Always skeleton with approval   |
| APPROVE_PLAN | Signal-based (same as standard) | Signal-based          | Review forced (every plan)      |
| EXECUTE      | Skip scratchpad                 | Scratchpad >500 words | Verbose scratchpad              |
| VERIFY       | `harness validate` only         | Full pipeline         | Expanded checks                 |
| INTEGRATE    | WIRE only                       | Full tier-appropriate | Full + every ADR draft reviewed |

Rigor decides how much is checked; autonomy decides who approves (see the Pause Protocol, D2). `--fast` never approves a plan or INTEGRATE on its own.

### Pause points

Every point below where this skill stops for the human carries a marker line, `_Pause point (<class>): resolve per the Pause Protocol._` followed by a `<!-- pause: <class> -->` comment. Resolve each one with the Pause Protocol: `agents/skills/templates/pause-protocol.md` (also shipped in the harness CLI package at `dist/agents/skills/templates/pause-protocol.md`).

- Re-read autonomy at every pause point: `gather_context({ path, session, include: ["autonomy"] })`.
- `irreversible` and `gate` pauses stop at every autonomy level.
- A `ceremony` or `judgment` pause auto-resolves only when autonomy is `trusted`, the pause states a recommendation, a `judgment` fork passed the self-audit, and `record_auto_decision` returned `recorded: true`. In every other case, pause exactly as written below.
- If you cannot read the protocol or resolve autonomy, pause.

## State Machine

```
INIT → ASSESS → PLAN → APPROVE_PLAN → EXECUTE → VERIFY → INTEGRATE → REVIEW → PHASE_COMPLETE
                                                                                  │
                                                                           [next phase?]
                                                                            │           │
                                                                         ASSESS   FINAL_REVIEW → OUTCOME_EVAL → DONE
```

---

### INIT

1. Resolve spec path (argument or prompt).
2. Derive session slug: strip `docs/`, drop `.md`, replace `/` and `.` with `--`, lowercase. Set `sessionDir = .harness/sessions/<slug>/`.
3. **Apply autonomy flags first (D17).** Before any subagent dispatch and before the first marked point below: if this skill was invoked with `--supervised`, call `manage_state({ action: "set-autonomy", path, session, level: "supervised" })`; if with `--audit`, call it with `audit: true`. Flags only lower autonomy: on `--trusted` or `--no-audit`, change nothing and print the raise hint from the Pause Protocol. Then read autonomy with `gather_context({ path, session, include: ["autonomy"] })`. With no session slug nothing can auto-resolve, so there is nothing to lower.
4. Check for existing state: read `{sessionDir}/autopilot-state.json`. If present and not DONE: report "Resuming from `{currentState}`, phase {N}: {name}." Apply schema migration if `schemaVersion < 5` (backfill missing fields). Jump to recorded state.
5. Fresh start: read spec, parse `## Implementation Order` for phases (`### Phase N: Name` + `<!-- complexity: low|medium|high -->`, default: `medium`). Capture `startingCommit` via `git rev-parse HEAD`, as the full 40-character sha. Write `autopilot-state.json` (schemaVersion: 5, currentState: "ASSESS", currentPhase: 0).
6. Flags: `--fast` → `rigorLevel: "fast"`. `--thorough` → `rigorLevel: "thorough"`. `--review-plans` → `reviewPlans: true`. Both flags together → reject with error.
7. Call `gather_context({ path, skill: "harness-autopilot", session: slug, include: ["state", "learnings", "handoff", "graph", "businessKnowledge", "sessions", "validation", "autonomy"] })`.
8. → ASSESS.

---

### After every dispatch

After every subagent dispatch (planner, task-executor, verifier, integration, reviewers, hooks), read `{sessionDir}/handoff.json` `blockers` and `concerns`.

_Pause point (gate): resolve per the Pause Protocol._ <!-- pause: gate -->

If any blocker starts with `audit-disagreement:`, the subagent hit a self-audit disagreement it could not settle headless (Pause Protocol, Escalation): present both positions from `concerns` to the human in plain text and wait for their choice. This escalation stops at every autonomy level. It is not a failure: it never enters the EXECUTE retry path, and the same unit is never re-dispatched to settle it. Once the human answers, record the answer per the Pause Protocol (Escalation) and resume the state that dispatched the unit, passing the answer to it as context.

_Pause point (judgment): resolve per the Pause Protocol._ <!-- pause: judgment -->

If any blocker starts with `judgment-fork:`, the subagent reached a judgment fork it could not audit (Pause Protocol, Handing a fork back). Resolve it here as a `judgment` pause per the Pause Protocol, using the options and recommendation from `concerns`. In `trusted` mode, run the self-audit in this session and auto-take only on agreement. Then remove that `judgment-fork:` blocker from `{sessionDir}/handoff.json`, so nothing later (for example the orchestrator) reads it as unresolved, and resume the state that dispatched the unit, passing the decision to it as context. Like a disagreement, it is not a failure and never enters the EXECUTE retry path.

