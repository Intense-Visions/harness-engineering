### Review records

REVIEW and FINAL_REVIEW share the rules in this section. The fields of the receipt and of a findings file, and every failure code of the gate, are defined in harness-code-review, "Review Receipt".

**Who writes what.** Every reviewer brief names the review directory, the moment and the reviewed head. A dispatched reviewer writes only its own findings file. The session that dispatched it (this one) writes `receipt.json` and runs the gate; harness-code-review states the same rule for the reviewer's side. For a `light` review the dispatched reviewer runs harness-code-review Phase 2 (MECHANICAL) and Phase 3 (CONTEXT) itself. For a `full` review this session runs Phases 2, 3 and 3.5 once and hands each reviewer its context bundle. Every dispatched reviewer lists in `examinedFiles` only files that `git diff --name-only --no-renames -z {base}..{head}` prints (with `-z` git prints a path with a non-ASCII character as it is, not quoted, which is the form the gate compares), and validates its own findings file before it returns with `harness check-review-receipt --findings {file} --base {base} --head {head}` (harness-code-review, "Reviewer findings files", says what it checks and prints), so a slip in the file is caught by the reviewer that made it and not by the receipt gate.

**Mechanical phase and its hook point.** harness-code-review Phase 2 has a hook point of its own, `after:mechanical`. When Phase 2 runs for an autopilot review (in this session for a `full` review, in the dispatched reviewer for a `light` one), the project's configured `skillHooks` for `harness-code-review` at `after:mechanical` run there as that skill describes, and their findings join the mechanical exclusion set. The craft domains that harness-code-review auto-wires at `after:mechanical` do **not** run there under autopilot: autopilot is the host of the review, so craft resolves once, at REVIEW step 5 (`after:REVIEW`) or at FINAL_REVIEW (`after:FINAL_REVIEW`), and its output goes to `hook-<hook name>.json` in the review directory and to the craft denominator. Never resolve craft at both points for one review.

**Clean tree.** A review reads the working tree, but its receipt is bound to one commit. Before step 1 of REVIEW and of FINAL_REVIEW, commit or discard every change to a tracked file: `git status --porcelain --untracked-files=no` must print nothing. The gate fails `WORKTREE_DIRTY` when tracked files differ from HEAD, and so does each reviewer's self-check with `--base` and `--head`. Untracked files, such as the review directory, do not count.

**Findings files.** Each is `{ schemaVersion: 1, reviewerId, head, examinedFiles, findings }`. `head` is the 40-character sha of the commit the reviewer read and must equal the receipt's `diff.head`: a file without it is invalid (`FINDINGS_FILE_INVALID`) and a file written at another head fails `FINDINGS_HEAD_MISMATCH`. Give every brief `{head}` as the resolved sha, never as the word `HEAD`. Finding ids are unique across the whole review (`DUPLICATE_FINDING_ID` otherwise), so every brief tells its reviewer to start each id with its reviewer id.

**Counts.** The receipt's `blocking` and `advisory` are counted over the reviewer findings files as written: every finding counts once, `critical` and `important` are blocking, `suggestion` is advisory, and nothing is merged by file or line. VALIDATE and DEDUP decide what this session acts on. They never edit a findings file and never change these counts, so the receipt can show a blocking finding that the validated list no longer holds.

**Hook findings.** The findings of an `after:REVIEW` or `after:FINAL_REVIEW` hook (a canary detector, a craft domain, a configured `skillHooks` entry) are written to their own `hook-<hook name>.json` file in the review directory. A hook file is not a reviewer findings file: it is never listed in the receipt's `reviewers`, its findings are never in the receipt's `blocking` or `advisory`, and the gate never reads it. A hook finding still blocks per that hook's own policy, in the fix-or-override question at the end of the review state. The human sees a blocking hook finding in the review report printed before that question and in the PHASE_COMPLETE or DONE summary. Craft findings are advisory and never block.

**After a fix.** A review that runs again for the same phase, or again as the final review, after a fix commit runs at the new head. Dispatch **every** required reviewer again with the same briefs, carrying no finding from the review before; a reviewer whose findings were all fixed still runs. Each reviewer rewrites its findings file and this session rewrites `receipt.json`. No file of the review before is reused: its `head` is the old commit, and the gate fails it (`FINDINGS_HEAD_MISMATCH`). `{base}` stays the same for a phase review. For the final review, resolve it again (FINAL_REVIEW step 2): it is the merge base every time, so a review after a fix reads the whole change again and never the fix alone.

**Overrides.** A review state left over a failed receipt gate, or over blocking findings, records the human's decision in `decisions[]`: the state (`REVIEW` or `FINAL_REVIEW`), for `REVIEW` the phase (its 0-based position, the `N` of `phase-N`), what was overridden (every failure code the gate raised, or the blocking findings), and the human's rationale. A gate or findings override is always the human's and never auto-resolves.

