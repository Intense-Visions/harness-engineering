--- SKILL.md (agents/skills/gemini-cli/uat-signoff/SKILL.md) ---
# UAT Sign-off

> Walk a human through user-acceptance testing for an engagement, one item at a time, and record their decision. The far-end mirror of the inception BRD: `product-advisor` captures what the client asked for; this captures whether the shipped reality is accepted against it. The human is the authority — this skill never judges, it records.

## When to Use

- At the **acceptance / outcome** edge of a client engagement, once work has shipped and a human (client product owner, solution architect, or sponsor) needs to sign off on it against the agreed requirements.
- When you want a durable, auditable record of "did the human accept what we shipped?" tied back to the engagement's BRD and gap-list.
- When the acceptance decision is a **human judgment** — a person accepts, rejects, or asks for changes — not a machine verdict.
- NOT for spec-vs-implementation judgment. `harness-acceptance-eval` (is the spec measurable?) and `harness-outcome-eval` (did the code satisfy the spec?) are LLM-judged, authority-derived, and merge/ship-blocking. UAT is **intent-vs-shipped-reality, human-judged, and advisory**.
- NOT for authoring or changing requirements — that is `product-advisor` (BRD) and `harness-brainstorming` (spec). This skill reads the BRD/gaps; it never rewrites them.
- NOT a gate. This skill records a decision; it does not block a merge, a ship, or a pipeline step.

## Process

### Iron Law

**The human makes the verdict; the skill only records it.** Never infer, guess, or auto-fill an ACCEPT/REJECT — not from the code, not from tests, not from an LLM. If the human has not ruled on an item, it stays open; you ask. Recording a decision the human did not make is the one unforgivable failure of this skill.

---

### Phase 1: RESOLVE — Load the acceptance basis

1. **Resolve the engagement slug.** From the `engagement` argument, or ask the human for the short name. This sets `docs/inception/<engagement>/`.
2. **Read the acceptance basis.** Read `docs/inception/<engagement>/brd.md` and `docs/inception/<engagement>/gaps.md`.
   - From `brd.md`, collect the acceptance-bearing items: functional requirements, success criteria, and any explicit acceptance criteria.
   - From `gaps.md`, collect the **Resolved** gaps (each captured decision is now a shipped commitment to confirm) and any **Open / client-facing** items (these are candidates the human may now be able to close).
3. **Soft-degrade when the basis is thin.** If `brd.md` is absent, say so plainly and offer to run acceptance against a manually supplied checklist. If only `gaps.md` exists, run against the resolved gaps. Do not fail — record what is missing and continue.
4. **Assemble the checklist.** Produce one scannable list of acceptance items, each with a stable id (reuse the BRD/gap id — e.g. `G3`, `FR-2` — verbatim; do not renumber). Present the full list to the human first so they can see the scope before ruling.

---

### Phase 2: INTERVIEW — One item at a time

1. **Present ONE item at a time, in plain text.** Show the item, its source (`brd.md` section or gap id), and what "accepted" means for it. Then ask for the human's disposition.

   **Ask directly in your reply. Do NOT route the question through any tool** (`emit_interaction`, `AskUserQuestion`, or similar) — those do not reliably surface the question to the human. Plain text in your own message is the only channel that reaches the signer across every client (Claude Code, Cursor, Codex, Gemini CLI).

   Present each item as a scannable choice with the three dispositions:

   ```markdown
   ### Item G3 — Okta OIDC authentication (source: brd.md FR-2)

   Accepted means: end users sign in via the client Okta tenant and land authenticated.

   |             | ACCEPT          | CHANGES_REQUESTED       | REJECT                     |
   | ----------- | --------------- | ----------------------- | -------------------------- |
   | **Means**   | Works as agreed | Close, needs a fix      | Does not meet the intent   |
   | **Records** | Item closed     | Item flagged for rework | Item blocks overall accept |

   Your call for G3? (ACCEPT / CHANGES_REQUESTED / REJECT) — add a note if you like.
   ```

2. **Capture the disposition verbatim** — `ACCEPT`, `REJECT`, or `CHANGES_REQUESTED` — plus any free-text note the human gives. Do not paraphrase a "yeah that's fine" into an ACCEPT without confirming; if the answer is ambiguous, ask again.
3. **Move to the next item only after the current one is ruled.** Do not batch. One item, one decision, then continue.
4. **Stop when every item is ruled.** Do not invent items beyond the checklist.

---

### Phase 3: VERDICT — One overall decision + signer

1. **Ask for the single overall decision.** After every item is ruled, ask the human for the overall verdict: `ACCEPTED`, `REJECTED`, or `CHANGES_REQUESTED`. Show them the item tally (how many accepted / changes-requested / rejected) so the overall call is informed, but let them make it — a human may accept overall despite a minor changes-requested item, or reject despite mostly-accepts.
2. **Capture the signer identity.** Ask who is signing off (`signedOffBy` — a name or role). Do not sign on their behalf.
3. **Confirm before recording.** Read back the overall decision, the signer, and the item tally in one short summary, and get a yes before writing anything.

---

### Phase 4: RECORD — Artifact + graph feed

1. **Write the sign-off artifact** to `docs/inception/<engagement>/signoff.md`, mirroring the shape of `gaps.md`: a **Resolved / accepted** section and a **Rejected / changes-requested** section, plus the signer identity and an ISO timestamp. Each item lists its id, source, disposition, and note. (See the template below.)
2. **Feed the graph.** Call the harness MCP tool `uat_signoff` with `{ engagement, decision, signedOffBy, items, brdRefs }`, where `items` is the per-item dispositions and `brdRefs` is the ids of the accepted items. This persists ONE `execution_outcome`-shaped node (`source: "uat-signoff"`, `result: "success"` when overall `ACCEPTED` else `"failure"`) so the existing eval-fail-rate signal and effectiveness baselines consume it. The write is advisory and record-only — it blocks nothing.
3. **Confirm the record.** Report the written artifact path and the recorded node id back to the human. If the MCP tool is unavailable, write `signoff.md` anyway and report that the graph feed was skipped — the artifact is the source of truth; the node is derived.

---

#### `signoff.md` template

```markdown
# UAT Sign-off — <engagement>

- **Overall decision:** <ACCEPTED | REJECTED | CHANGES_REQUESTED>
- **Signed off by:** <name / role>
- **Date:** <ISO timestamp>

## Resolved / accepted

- **<id>** (<source>) — ACCEPT. <note>

## Rejected / changes-requested

- **<id>** (<source>) — <REJECT | CHANGES_REQUESTED>. <note>
```

---

## Harness Integration

- **`uat_signoff`** — Phase 4: persist the human decision as one `execution_outcome` node (`source: "uat-signoff"`). Advisory / record-only; reuses the shared node shape so signals consume it for free. Never derives a verdict.
- **Read `brd.md` / `gaps.md`** — Phase 1: load the acceptance basis. Read-only; this skill never rewrites the BRD or the gap-list.
- **`harness validate`** — After recording: verify artifact placement and project health.

## Success Criteria

- Running the skill for an engagement produces `docs/inception/<engagement>/signoff.md` with the overall decision, signer identity, timestamp, and a resolved-vs-rejected split of items.
- Every acceptance item from the BRD/gaps was presented to the human one at a time and ruled by the human (ACCEPT / REJECT / CHANGES_REQUESTED).
- The overall decision and signer were provided by the human, not inferred.
- Exactly one `execution_outcome` node was recorded via `uat_signoff`, with `source: "uat-signoff"`, `result` derived from the overall decision, and `metadata` carrying `signedOffBy`, `decision`, and `brdRefs`.
- No requirement, spec, or verdict was authored by an LLM in this skill.
- When the BRD/gaps basis was thin or absent, the skill degraded to a supplied checklist and recorded what was missing rather than failing.

## Examples

### Example: acceptance sign-off for a retail loyalty engagement

**RESOLVE:**

```
engagement: acme-loyalty
Read docs/inception/acme-loyalty/brd.md + gaps.md.
Checklist assembled: G1 (Okta OIDC), G2 (Rewards Engine trigger), FR-1 (POS ↔ Loyalty API), G5 (reporting cadence).
Presented the 4-item checklist to the client PO before ruling.
```

**INTERVIEW (one item at a time):**

```
G1 (Okta OIDC): "ACCEPT — login works against our tenant." → captured ACCEPT.
G2 (Rewards Engine trigger): "CHANGES_REQUESTED — fires on transaction but misses refunds." → captured CHANGES_REQUESTED + note.
FR-1 (POS ↔ Loyalty API): "ACCEPT." → captured ACCEPT.
G5 (reporting cadence): "REJECT — we agreed weekly, this is monthly." → captured REJECT + note.
```

**VERDICT:**

```
Tally: 2 ACCEPT, 1 CHANGES_REQUESTED, 1 REJECT.
Overall decision (human): CHANGES_REQUESTED.
Signed off by: Dana Okoro (Acme Product Owner).
Read back + confirmed.
```

**RECORD:**

```
Wrote docs/inception/acme-loyalty/signoff.md
  Resolved/accepted: G1, FR-1
  Rejected/changes-requested: G2 (refunds), G5 (cadence)
Called uat_signoff → execution_outcome node recorded (result: failure; source: uat-signoff).
Reported artifact path + node id to Dana. Advisory only — nothing blocked.
```

## Gates

- **No inferred decisions.** Every item disposition and the overall verdict come from the human. Filling one in yourself = Iron Law violation; stop and ask.
- **No judging.** This skill records a human decision; it does not run an LLM verdict, derive authority, or block anything. Producing a machine verdict = gate violation (that is `outcome-eval`'s job, and it is a different contract).
- **No rewriting requirements.** `brd.md` and `gaps.md` are read-only here. Editing them to match the sign-off = gate violation; requirements changes go back through `product-advisor` / `harness-brainstorming`.
- **No silent skip.** If an item cannot be ruled (the human defers), it stays open in `signoff.md` under changes-requested with a note — it is not dropped.
- **No hard failure on a thin basis.** Absent `brd.md`/`gaps.md` → degrade to a supplied checklist and record the gap. Aborting because the basis is thin = gate violation.

## Escalation

- **The human wants to accept overall while items are rejected:** That is their call — record it faithfully. Note the tension in `signoff.md` (overall ACCEPTED with N rejected items) so it is auditable, but do not override the human.
- **The BRD and the shipped reality clearly diverge and the human is unsure:** Do not rule for them. Report: "This item's shipped behavior differs from the BRD; I can only record your decision — accept, reject, or request changes?"
- **No `brd.md` and no `gaps.md`:** Report that there is no acceptance basis on disk and offer to run against a checklist the human supplies. If they decline, stop with "No acceptance basis; nothing to sign off against."
- **The `uat_signoff` MCP tool is unavailable:** Write `signoff.md` anyway and report: "Sign-off artifact written; graph feed skipped (uat_signoff unavailable). Re-run RECORD when MCP is restored." The artifact is the source of truth.

## Rationalizations to Reject

| Rationalization                                                         | Reality                                                                                                                                                  |
| ----------------------------------------------------------------------- | -------------------------------------------------------------------------------------------------------------------------------------------------------- |
| "The tests pass, so I'll mark the items ACCEPT to save the human time"  | Passing tests are not human acceptance. UAT records a person's judgment against intent — inferring ACCEPT from green tests is the Iron Law violation.    |
| "I can tell this meets the BRD, I'll just write the verdict"            | This skill never judges. A machine verdict is `outcome-eval`'s job under a different (authority-derived) contract. Here the human is the sole authority. |
| "The BRD is slightly wrong; I'll fix it while I'm here"                 | `brd.md`/`gaps.md` are read-only in UAT. Requirement changes go back through `product-advisor` / `harness-brainstorming`, not a side effect of sign-off. |
| "The human said 'looks good' — that's an overall ACCEPT for everything" | Confirm item by item and the overall call explicitly. A blanket "looks good" is not a per-item ruling; ask before recording accepts.                     |
| "There's no BRD, so I can't run — I'll abort"                           | Degrade to a supplied checklist and record that the BRD was absent. Aborting throws away a sign-off the human is ready to give.                          |

## Red Flags

| Flag                                                      | Corrective Action                                                                                                                      |
| --------------------------------------------------------- | -------------------------------------------------------------------------------------------------------------------------------------- |
| "I'll batch all items into one question to speed this up" | STOP. One item at a time is prescribed — batched items get partial rulings and lose the per-item record. Present the next single item. |
| "The human is busy; I'll sign off on their behalf"        | STOP. `signedOffBy` is a human identity the human provides. Signing for them fabricates an acceptance record. Ask who is signing.      |
| "This item is obviously fine; I'll pre-select ACCEPT"     | STOP. No pre-selection. Present the item neutrally and record only the human's answer.                                                 |
| "I'll block the ship because an item was rejected"        | STOP. This skill is advisory / record-only. It records the decision; it never blocks. Escalation is the human's to act on.             |

