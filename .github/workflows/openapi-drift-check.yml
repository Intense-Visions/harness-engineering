name: OpenAPI Drift Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/orchestrator/src/gateway/openapi/**'
      - 'packages/types/src/auth.ts'
      - 'docs/api/openapi.yaml'
      - '.github/workflows/openapi-drift-check.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Build in dependency order: types → graph → core+intelligence → orchestrator.
      # graph must build before core because core/src/entropy/snapshot.ts imports
      # types from @harness-engineering/graph via DTS.
      - run: pnpm --filter @harness-engineering/types build
      - run: pnpm --filter @harness-engineering/graph build
      - run: pnpm --filter @harness-engineering/core build
      - run: pnpm --filter @harness-engineering/intelligence build
      # orchestrator imports @harness-engineering/local-models (see its package.json).
      # It was missing from this hand-maintained order, so the orchestrator DTS build
      # failed with TS2307 on a module that exists in the workspace but had never been
      # built. Only needs types, which is already first.
      - run: pnpm --filter @harness-engineering/local-models build
      - run: pnpm --filter @harness-engineering/orchestrator build
      - name: Regenerate OpenAPI artifact
        run: pnpm --filter @harness-engineering/orchestrator openapi:generate
      - name: Verify no drift
        run: |
          if ! git diff --exit-code docs/api/openapi.yaml; then
            echo "::error::OpenAPI artifact is out of sync with code. Run 'pnpm --filter @harness-engineering/orchestrator openapi:generate' and commit the result."
            exit 1
          fi
