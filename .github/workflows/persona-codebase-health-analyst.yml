      - run: node packages/cli/dist/bin/harness.js graph status || echo "::warning::advisory persona check 'graph status' reported findings (non-blocking)"
      - run: node packages/cli/dist/bin/harness.js check-deps || echo "::warning::advisory persona check 'check-deps' reported findings (non-blocking)"
      - run: node packages/cli/dist/bin/harness.js check-perf || echo "::warning::advisory persona check 'check-perf' reported findings (non-blocking)"
      - run: node packages/cli/dist/bin/harness.js check-security --severity warning || echo "::warning::advisory persona check 'check-security' reported findings (non-blocking)"
