name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  # Lightweight gate — build+typecheck only. Full lint+test runs in the CI workflow.
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      # Advisory (non-blocking) golden-build drift report against the last
      # promoted golden. `golden-build diff` always exits 0 and reports cleanly
      # when no golden has been promoted yet (first release), so this is a clean
      # no-op then and never fails the gate. The `|| echo ::warning::` guard only
      # fires if the binary itself cannot run — it must never block the release.
      - name: Golden-build drift report (advisory)
        run: |
          node packages/cli/dist/bin/harness.js golden-build diff \
            || echo "::warning::golden-build drift check could not complete (advisory)"

  release:
    needs: ci-gate
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.cli-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # OIDC publish requires npm >= 11.5.1; Node 22 ships with npm 10.x.
      # Pin to npm 11.x: npm 12.0.0 ships a broken bundle where `sigstore` is not
      # hoisted next to the runtime libnpmpublish copy, so `--provenance` publishes
      # crash with "Cannot find module 'sigstore'". Revisit once npm >=12 fixes it.
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          HUSKY: '0'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Extract CLI version for Docker
        id: cli-version
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name == "@harness-engineering/cli") | .version')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            VERSION=$(node -p "require('./packages/cli/package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A published release SETS a new golden known-good reference: snapshot the
      # just-released working tree (version-bumped manifests, lockfile, config,
      # baselines) and commit the manifest back to main. Only runs on an actual
      # publish. `[skip ci]` on the commit stops this push from re-triggering
      # the Release workflow. HUSKY=0 keeps the commit hook-safe (no --no-verify).
      - name: Promote golden build reference state
        if: steps.changesets.outputs.published == 'true'
        env:
          HUSKY: '0'
        run: |
          node packages/cli/dist/bin/harness.js golden-build promote
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .harness/golden/manifest.json
          git diff --cached --quiet || git commit -m "chore: promote golden build reference state [skip ci]"
          git push

  docker:
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write
