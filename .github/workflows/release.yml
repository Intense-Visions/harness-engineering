name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  # Lightweight gate — build+typecheck only. Full lint+test runs in the CI workflow.
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      # Advisory (non-blocking) golden-build drift report against the last
      # promoted golden. `golden-build diff` always exits 0 and reports cleanly
      # when no golden has been promoted yet (first release), so this is a clean
      # no-op then and never fails the gate. The `|| echo ::warning::` guard only
      # fires if the binary itself cannot run — it must never block the release.
      - name: Golden-build drift report (advisory)
        run: |
          node packages/cli/dist/bin/harness.js golden-build diff \
            || echo "::warning::golden-build drift check could not complete (advisory)"

  release:
    needs: ci-gate
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.cli-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # OIDC publish requires npm >= 11.5.1; Node 22 ships with npm 10.x.
      # Pin to npm 11.x: npm 12.0.0 ships a broken bundle where `sigstore` is not
      # hoisted next to the runtime libnpmpublish copy, so `--provenance` publishes
      # crash with "Cannot find module 'sigstore'". Revisit once npm >=12 fixes it.
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          # `pnpm run version` — the `run` is REQUIRED and not stylistic.
          #
          # `version` is a built-in pnpm command, so a bare `pnpm version`
          # resolves to the built-in (which just PRINTS a version dictionary)
          # and never executes package.json's `version` script. The release then
          # bumps nothing, `changeset-release/main` comes out identical to main,
          # and the action dies creating its PR:
          #   Validation Failed: No commits between main and changeset-release/main
          # `publish: pnpm release` above is safe from this only because
          # `release` is NOT a built-in and falls through to `run`.
          #
          # We override the action's default (`changeset version`) at all because
          # the default skips scripts/sync-plugin-pin.mjs — the only thing that
          # re-pins the five plugin/extension manifests to the new CLI version.
          # Without it every release shipped manifests pinned to the PREVIOUS
          # version and left main red on the plugin-pin-sync assertion in
          # tests/scripts/plugin-pin-sync.test.mjs. package.json's `version`
          # script pairs the bump and the sync; this input invokes that script.
          version: pnpm run version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          HUSKY: '0'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Extract CLI version for Docker
        id: cli-version
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name == "@harness-engineering/cli") | .version')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            VERSION=$(node -p "require('./packages/cli/package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A published release SETS a new golden known-good reference: snapshot the
      # just-released working tree (version-bumped manifests, lockfile, config,
      # baselines) and commit the manifest back to main. Only runs on an actual
      # publish. `[skip ci]` on the commit stops this push from re-triggering
      # the Release workflow. HUSKY=0 keeps the commit hook-safe (no --no-verify).
      - name: Promote golden build reference state
        if: steps.changesets.outputs.published == 'true'
        env:
          HUSKY: '0'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOAPPROVE_PAT: ${{ secrets.BASELINE_AUTOAPPROVE_PAT }}
        run: |
          node packages/cli/dist/bin/harness.js golden-build promote
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MANIFEST=".harness/golden/manifest.json"
          git add "$MANIFEST"
          if git diff --cached --quiet; then
            echo "Golden manifest unchanged; nothing to promote."
            exit 0
          fi
          git commit -m "chore: promote golden build reference state [skip ci]"
          OURS=$(git rev-parse HEAD)
          BASE="${GITHUB_REF_NAME}"

          # 1) Try a direct push, absorbing any concurrent merge. Reset hard to our
          #    commit before each retry so a failed rebase can never leave the tree
          #    dirty for the next attempt.
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git reset --hard "$OURS" >/dev/null
            git fetch origin "$BASE" -q || true
            if git rebase "origin/$BASE" && git push origin "HEAD:$BASE" 2>/dev/null; then
              echo "Pushed golden-manifest promotion directly to $BASE on attempt $attempt."
              exit 0
            fi
            echo "Direct push attempt $attempt failed; retrying."
            sleep 3
          done

          # 2) Direct push is blocked by branch protection ("changes must be made
          #    through a pull request"). Open a scope-guarded self-approved PR, the
          #    same fallback roadmap-auto-done.yml uses. Without this the step exited
          #    1 on every publish, so the release ran red even though the packages
          #    had already gone out, and the golden reference never advanced.
          echo "Direct push unavailable; opening a self-approved PR."
          git fetch origin "$BASE" -q
          BRANCH="chore/golden-promote-$(git rev-parse --short "$OURS")-$(date +%s)"
          git checkout -B "$BRANCH" "origin/$BASE"
          git checkout "$OURS" -- "$MANIFEST"
          git add "$MANIFEST"
          if git diff --cached --quiet; then
            echo "Base already carries this golden manifest; nothing to PR."
            exit 0
          fi
          git commit -m "chore: promote golden build reference state [skip ci]"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "chore: promote golden build reference state" \
            --body "Automated golden-build reference promotion after a successful publish. Opened because direct pushes to $BASE are blocked by branch protection." \
            --base "$BASE" \
            --head "$BRANCH")
          # Defensive scope check: the PAT may only ever approve a diff confined to
          # the golden manifest (mirrors the roadmap auto-done guard).
          gh pr diff "$PR_URL" --name-only | node scripts/assert-diff-scope.mjs "$MANIFEST"
          GH_TOKEN="$AUTOAPPROVE_PAT" gh pr review "$PR_URL" --approve \
            --body "Auto-approved: golden-build reference promotion from github-actions[bot]."
          gh pr merge "$PR_URL" --auto --squash --delete-branch

  docker:
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write
