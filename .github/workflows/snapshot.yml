name: Architecture Snapshot
on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch: {} # Manual trigger

# The weekly cron and a manual dispatch can overlap. Two runs both appending to the
# same `.harness/arch/timeline.json` would race on the fallback branch below, so
# serialize them instead of cancelling (a cancelled capture loses that week's point).
concurrency:
  group: architecture-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` for the direct-push path; `pull-requests: write` for the
      # `gh pr create` fallback taken when branch protection blocks a direct push to
      # main (which is the current ruleset — see the Commit snapshot step). Without
      # `pull-requests: write`, gh fails with "Resource not accessible by integration".
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node packages/cli/dist/bin/harness.js snapshot capture
      # Commit the captured timeline point via the bot. Scoped strictly to
      # `.harness/arch/timeline.json` so the bot can only ever touch the artifact it
      # just generated. Direct push first; PR fallback (for human review — no PAT,
      # no auto-approve) when branch protection blocks the direct push. Mirrors the
      # "Commit refreshed semantic shards" job in ci.yml.
      - name: Commit snapshot
        env:
          # Disable husky so `git commit`/`git push` hooks cannot run the pre-commit
          # gauntlet (coverage ratchet, `generate-docs --check`, tool-catalog
          # `--check`) inside this step and fail it or leave the tree dirty. Same
          # posture as roadmap-auto-done.yml.
          HUSKY: '0'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TIMELINE=".harness/arch/timeline.json"
          git add "$TIMELINE"
          if git diff --cached --quiet; then
            echo "No snapshot change to commit."
            exit 0
          fi
          # `[skip ci]` keeps the direct-push path from starting a fresh CI run on main
          # (the same guard every other commit-back job in this repo carries).
          git commit -m "chore: architecture snapshot $(date +%Y-%m-%d) [skip ci]"
          OURS=$(git rev-parse HEAD)
          if git push 2>&1; then
            exit 0
          fi
          echo "Direct push blocked by branch protection. Opening a PR instead."
          git fetch origin main
          # Union-merge timelines instead of copying "ours" over a base: a fresh
          # capture (taken from main) lacks any point an unmerged snapshot PR
          # carries, so a wholesale copy in either direction DROPS weeks.
          # scripts/merge-arch-timeline.mjs keeps every distinct point, sorted.
          git show "$OURS:$TIMELINE" > "$RUNNER_TEMP/ours.json"
          git show "origin/main:$TIMELINE" > "$RUNNER_TEMP/main.json" 2>/dev/null || : > "$RUNNER_TEMP/main.json"

          # Never stack a SECOND snapshot PR on an unmerged one: both branches would
          # append to the same JSON array and conflict. But never DISCARD this week's
          # point either (#2266): skipping with `exit 0` here once froze the series
          # for three green weeks while #2232 sat open, with nothing announcing it.
          # Instead FOLD the new point into the waiting PR — rebuild its branch on
          # the current main tip carrying the union of main's, the PR's and this
          # run's points — so the open PR accumulates every week it blocks and
          # stays conflict-free with main.
          EXISTING_JSON=$(gh pr list --state open --base main --json number,headRefName,createdAt \
            --jq '[.[] | select(.headRefName | startswith("chore/arch-snapshot-"))] | sort_by(.createdAt) | .[0] // empty')
          if [ -n "$EXISTING_JSON" ]; then
            EXISTING=$(echo "$EXISTING_JSON" | jq -r '.number')
            BRANCH=$(echo "$EXISTING_JSON" | jq -r '.headRefName')
            CREATED=$(echo "$EXISTING_JSON" | jq -r '.createdAt')
            AGE_DAYS=$(( ( $(date -u +%s) - $(date -u -d "$CREATED" +%s) ) / 86400 ))
            git fetch origin "$BRANCH"
            git show "origin/$BRANCH:$TIMELINE" > "$RUNNER_TEMP/pr.json" 2>/dev/null || : > "$RUNNER_TEMP/pr.json"
            git checkout -B "$BRANCH" origin/main
            node scripts/merge-arch-timeline.mjs "$TIMELINE" \
              "$RUNNER_TEMP/main.json" "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/ours.json"
            git add "$TIMELINE"
            if git diff --cached --quiet; then
              echo "Latest main already carries every pending snapshot point; nothing to fold into #$EXISTING."
              exit 0
            fi
            git commit -m "chore: architecture snapshot $(date +%Y-%m-%d) [skip ci]"
            # Lease against the ref just fetched: never clobber a concurrent push to
            # the PR branch. Losing that race is reported RED, not swallowed — a
            # green run that dropped its point is the exact failure #2266 is about.
            if ! git push --force-with-lease="$BRANCH:origin/$BRANCH" origin "HEAD:$BRANCH"; then
              echo "::error::Could not fold this week's snapshot into #$EXISTING (its branch moved concurrently). This week's point is NOT recorded; re-run the workflow."
              exit 1
            fi
            # Visible, not silent: say the series is waiting on a human merge.
            echo "::warning::Snapshot PR #$EXISTING has been open ${AGE_DAYS} day(s); folded this week's point into it. The architecture timeline on main does not advance until it is merged."
            gh pr comment "$EXISTING" --body "Folded the $(date -u +%Y-%m-%d) architecture snapshot into this PR (rebuilt on the current main; open ${AGE_DAYS} day(s)). Every point captured while this PR waits accumulates here; merging it advances \`$TIMELINE\` on main." \
              || echo "::warning::Could not post the fold comment on #$EXISTING."
            exit 0
          fi

          BRANCH="chore/arch-snapshot-$(date +%s)"
          git checkout -B "$BRANCH" origin/main
          node scripts/merge-arch-timeline.mjs "$TIMELINE" "$RUNNER_TEMP/main.json" "$RUNNER_TEMP/ours.json"
          git add "$TIMELINE"
          if git diff --cached --quiet; then
            echo "Latest main already carries this snapshot; nothing to PR."
            exit 0
          fi
          git commit -m "chore: architecture snapshot $(date +%Y-%m-%d) [skip ci]"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "chore: architecture snapshot $(date +%Y-%m-%d)" \
            --body "Automated weekly architecture-timeline capture. Opened because a direct push to main is blocked by branch protection (GH013 \`Changes must be made through a pull request\`). Merging advances \`.harness/arch/timeline.json\`, the series read by \`get_decay_trends\`, \`harness snapshot trend\`, and \`predict_failures\` (which needs >= 3 points)." \
            --base main \
            --head "$BRANCH"
