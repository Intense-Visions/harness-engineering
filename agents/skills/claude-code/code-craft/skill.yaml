name: code-craft
version: "0.1.0"
description: LLM-judgment critique of code quality / readability (TS/JS source) — the ceiling counterpart to the rule-based code floor (entropy-cleaner for dead code / drift, enforce-architecture for boundaries + deps, complexity thresholds). Asks whether the code reveals intent and reads in the domain's language, whether the control flow is honest, whether a function tells one story at one altitude, whether each abstraction earns its keep, whether it is as simple as it could be, whether the signature keeps its promise, and whether a senior would nod or wince. Per-unit critique of functions, methods, and classes; identifier-level naming is delegated to naming-craft. Structural twin of harness-security-craft.
stability: draft
cognitive_mode: constructive-architect
triggers:
  - manual
  - on_pr
  - on_new_feature
platforms:
  - claude-code
tools:
  - Bash
  - Read
  - Glob
  - Grep
cli:
  command: harness code-craft
  args:
    - name: path
      description: Project root path
      required: false
    - name: files
      description: Optional file scope (overrides discovery)
      required: false
    - name: packages
      description: Restrict to specific packages under packages/
      required: false
    - name: max-files
      description: Cap source-file count (default 100)
      required: false
    - name: max-units-per-file
      description: Cap per-file unit critique (default 20)
      required: false
mcp:
  tool: code_craft
  input:
    path: string
type: rigid
tier: 2
phases:
  - name: discover
    description: Walk packages/STAR/src/ recursively; exclude tests + build dirs
    required: true
  - name: units
    description: AST-driven extraction of substantive code units (functions, methods, classes); trivial units skipped
    required: true
  - name: critique
    description: LLM-rubric loop per (unit, rubric) filtered by unit kind, with conservative-confidence bias — 7 seed rubrics
    required: true
  - name: report
    description: Aggregate findings + rubric/exemplar catalog + cost telemetry + file/unit counts
    required: true
state:
  persistent: false
depends_on:
  - cleanup-dead-code
  - enforce-architecture
  - naming-craft
