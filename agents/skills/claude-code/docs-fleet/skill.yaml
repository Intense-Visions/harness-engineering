name: docs-fleet
version: '1.0.0'
description: Autonomous documentation-drift remediation sweep — enumerate the doc-drift/undocumented backlog by composing the existing documentation-floor detectors, rank the areas by staleness value, confirm the batch once, fan out worktree-isolated subagents that each run the real per-area harness-docs-pipeline to convergence, independently verify each result by a clean doc re-scan and all-OS CI, and hand back a batch of scoped doc-fix PRs for one bulk human review. Never auto-merges.
stability: static
cognitive_mode: systematic-orchestrator
triggers:
  - manual
platforms:
  - claude-code
  - codex
  - cursor
  - gemini-cli
tools:
  - Bash
  - Read
  - Glob
  - Grep
cli:
  command: harness skill run docs-fleet
  args:
    - name: path
      description: Project root path
      required: false
    - name: --concurrency
      description: 'Cap on concurrent remediation subagents (default: 2, max recommended 3 — the machine-storm limit)'
      required: false
    - name: --report-only
      description: Enumerate, score, and present the ranked doc-area batch without dispatching remediation subagents
      required: false
    - name: --dry-run
      description: Run SELECT and CONFIRM only; do not fan out, verify, or open PRs
      required: false
    - name: --safe-only
      description: Restrict remediation to the safe fix class even if an area's probably-safe/unsafe change looks mechanical
      required: false
mcp:
  tool: run_skill
  input:
    skill: docs-fleet
    path: string
type: rigid
tier: 2
phases:
  - name: select
    description: Enumerate the documentation-drift/coverage backlog by composing detect-doc-drift, harness check-docs, harness-docs-pipeline (report-only) and a doc-churn pass into doc-fix areas, cross-check against merged/open PRs, classify safe vs probably-safe vs unsafe, and score by composite churn-gap x drift-density x coverage-gap
    required: true
  - name: confirm
    description: Present the ranked doc-area batch in one round — already-fresh areas flagged for drop, fix classifications confirmed, unsafe areas flagged as will-park, proposed concurrency — for a single up-front human approval
    required: true
  - name: dispatch
    description: Fan out worktree-isolated subagents, each running the real harness-docs-pipeline --fix scoped to one area, capped at the concurrency governor and consulting the per-leaf context budget; an area needing an unsafe documentation change parks and reports
    required: true
  - name: verify
    description: Independently confirm each returned branch converged (opening drift/coverage findings resolved and a fresh detect-doc-drift + harness check-docs re-scan clean) and is CI-green across all target operating systems plus the project's required checks against a fresh base — never by subagent self-report
    required: true
  - name: report
    description: Emit a one-row-per-area batch summary with findings-resolved counts, assumptions notes, and parked unsafe remediations for bulk human review, annotate already-fresh areas citing the resolving PR, never merge
    required: true
state:
  persistent: false
  files: []
depends_on:
  - detect-doc-drift
  - harness-docs-pipeline
  - harness-roadmap-pilot
addresses:
  - signal: doc-gaps
    weight: 0.7
  - signal: drift
    weight: 0.5
capabilities:
  tools:
    - Bash
    - Read
    - Glob
    - Grep
  network: false
  filesystem: read-write
