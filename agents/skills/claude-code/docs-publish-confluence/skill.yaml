name: docs-publish-confluence
version: '0.1.0'
description: Confluence provider adapter implementing the docs-publish contract — maps draft, attach-media, verify-render, and page-tree to Confluence Cloud mechanics (the attachment-upload recipe, ADF media forms, the draft/publish race, the page-tree move endpoint, DOM render verification, and deterministic stills). Ships zero company-specific content; reads org pointers from the shared company-knowledge config contract.
stability: draft
cognitive_mode: methodical-operator
triggers:
  - manual
platforms:
  - claude-code
tools:
  - Bash
  - Read
  - Write
  - Edit
  - Glob
  - Grep
cli:
  command: harness skill run docs-publish-confluence
  args:
    - name: path
      description: Project root path
      required: false
mcp:
  tool: run_skill
  input:
    skill: docs-publish-confluence
type: rigid
tier: 2
phases:
  - name: preflight
    description: Confirm a logged-in browser tab on the Atlassian origin, resolve the target page id, and confirm you are operating on a DRAFT
    required: true
  - name: upload-attachments
    description: Upload attachments via the scratch-file + osascript injection recipe (the Atlassian MCP has no attachment API); verify authoritatively with a GET
    required: true
  - name: emit-adf
    description: Always emit media-single figures; document media-inline file-chips; never rely on media-group for figures
    required: true
  - name: page-tree-ops
    description: Create children under a draft parent, order the sidebar via the move endpoint, and preserve data-local-id on retained nodes in full-body round-trips
    required: true
  - name: handle-draft-publish-race
    description: Understand draft-vs-just-published update semantics, stale-editor clobbering, and tiny-link resolution timing
    required: true
  - name: verify-render
    description: Run DOM render assertions in view or editor mode before declaring a page done
    required: true
  - name: deterministic-stills
    description: Render reproducible stills with a browser automation tool against local file HTML with fixed color scheme and reduced motion
    required: true
state:
  persistent: false
  files: []
depends_on:
  - docs-publish
