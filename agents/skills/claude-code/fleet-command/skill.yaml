name: fleet-command
version: '1.0.0'
description: Conductor for the fleet family — one tier above the members, coordinating the fleets themselves rather than fanning out over an item queue. Probes each installed fleet's queue, derives the run as a hybrid dependency DAG (a CI-trustworthiness prerequisite first, the conveyor spine in dependency order, the independent quality sweeps parallel alongside, the land stage terminal), enforces one global leaf-slot budget across every fleet in flight instead of additive per-fleet governors, serializes the lanes whose emissions collide and plans a merge order for the ones that only conflict on generated artifacts, presents each ready fleet's own human CONFIRM verbatim in one batched round per wave without ever answering it, verifies every lane from its emitted artifacts rather than its self-report, and hands back one consolidated report. Never merges.
stability: static
cognitive_mode: systematic-orchestrator
triggers:
  - manual
platforms:
  - claude-code
  - codex
  - cursor
  - gemini-cli
tools:
  - Bash
  - Read
  - Glob
  - Grep
cli:
  command: harness skill run fleet-command
  args:
    - name: path
      description: Project root path
      required: false
    - name: --fleets
      description: Restrict the run to a comma-separated subset of the installed fleets; the selection is confirmed at CONFIRM either way
      required: false
    - name: --slots
      description: 'Global cap on concurrent per-item subagents across every fleet in flight (default: 3, hard max 4) — never the sum of the per-fleet governors'
      required: false
    - name: --max-fleets
      description: 'Cap on how many fleets a single run schedules (default: 6); fleets beyond the cap are reported as shed with their reason'
      required: false
    - name: --wall-clock
      description: 'Wall-clock budget for the run (default: 8h); exhausting it stops scheduling new lanes and reports partial results rather than killing in-flight work'
      required: false
    - name: --report-only
      description: Probe the queues, derive the DAG and the contention map, and present the run plan without dispatching any lane
      required: false
    - name: --dry-run
      description: Run SELECT and CONFIRM only; stop before any lane is dispatched
      required: false
mcp:
  tool: run_skill
  input:
    skill: fleet-command
    path: string
type: rigid
tier: 2
phases:
  - name: select
    description: Determine which fleet members are installed, probe each one's queue depth through its own report-only or dry-run path rather than reimplementing its selection, drop empty-queue fleets as unscheduled rather than running them, derive the wave assignment from the fixed dependency shape with the CI-trustworthiness prerequisite ahead of the conveyor spine and the independent quality sweeps parallel alongside, build the contention map over the four collision classes and the derived merge-order plan it implies, detect the run-level forks worth surfacing, and degrade the DAG to the members actually present while recording every member that is missing
    required: true
  - name: confirm
    description: Present the wave DAG, the fleet selection with its probed queue depths and its unscheduled empty-queue fleets, the global budget of slots and one pass per fleet and the fleet cap and the wall-clock, the contention map with its serialization and merge-order consequences, and the detected forks with recommended defaults, together in one surface for a single run-plan authorization in which the human approves or trims fleets or re-tunes the budget once and trimming re-derives the DAG
    required: true
  - name: dispatch
    description: Schedule one worktree-isolated lane per scheduled fleet wave by wave, each lane running the real member skill rather than a reimplementation of it, admitting a lane to its fan-out phase only as a global slot frees and never co-scheduling a serialized pair, presenting each wave's ready fleets' own CONFIRM gates together in one batched round verbatim and unmodified, parking a lane that hits an unforeseen run-level fork while the other lanes continue, and stopping new scheduling on budget exhaustion without killing in-flight lanes
    required: true
  - name: verify
    description: Confirm each lane from its emitted artifacts rather than its self-report — the terminal artifact exists in the form that member's contract specifies, per-item verdicts are present with the references they were drawn from and those references are independently spot-checked, the lane never exceeded its allocation from the global pool, and nothing was merged outside a human-authorized land inside the land member's own gate — while all-OS CI is recorded as not-applicable at this tier with its reason and never dropped silently
    required: true
  - name: report
    description: Emit one consolidated dashboard carrying a per-lane row with its wave and verdict and emissions and slot usage and parked forks, the cross-fleet-deduped filing list in which one defect raised by several sweeps becomes one row citing every lane that raised it, the recommended merge order with its regeneration sequence as advice rather than an action, the run's budget accounting, everything the budget shed named with its reason, and an assumptions-made note; never merge and never authorize a land
    required: true
state:
  persistent: false
  files: []
depends_on:
  - ideate-fleet
  - issue-fleet
  - adr-fleet
  - roadmap-fleet
  - pr-fleet
  - cicd-fleet
  - test-fleet
  - security-fleet
  - cleanup-fleet
  - bug-fleet
  - craft-fleet
addresses:
  - signal: backlog-pressure
    weight: 0.4
  - signal: drift
    weight: 0.2
capabilities:
  tools:
    - Bash
    - Read
    - Glob
    - Grep
  network: false
  filesystem: read-write
