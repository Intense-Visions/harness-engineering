name: fleet-command
version: '1.0.0'
description: Conductor for the fleet family — one tier above the members, coordinating the fleets themselves rather than fanning out over an item queue. Probes each installed fleet's queue through that member's gate-free path only, derives the run as a hybrid dependency DAG (a CI trust gate first, then ideation, then intake with the independent quality sweeps parallel alongside, then decide, build, and the land stage terminal), and enforces one global leaf-slot budget across every fleet in flight instead of additive per-fleet governors by dispatching every lane with its allocated --concurrency, never more than 2 of the pool. The CI wave is a trust gate rather than a repair — the CI member hands back unmerged remediation PRs, so an untrustworthy signal is surfaced at CONFIRM as a fork with a recommended default and any run taken under it has its downstream verdicts labelled degraded. Serializes the lanes whose emissions collide, plans a merge order for the ones that only conflict on generated artifacts, presents each ready fleet's own human CONFIRM verbatim in one batched round per wave without ever answering it, verifies every lane from its emitted artifacts rather than its self-report, and hands back one consolidated report. Never merges.
stability: static
cognitive_mode: systematic-orchestrator
triggers:
  - manual
platforms:
  - claude-code
  - codex
  - cursor
  - gemini-cli
tools:
  - Bash
  - Read
  - Glob
  - Grep
cli:
  command: harness skill run fleet-command
  args:
    - name: path
      description: Project root path
      required: false
    - name: --fleets
      description: Restrict the run to a comma-separated subset of the installed fleets; the selection is confirmed at CONFIRM either way
      required: false
    - name: --slots
      description: 'Global cap on concurrent per-item subagents across every fleet in flight (default: 3, hard max 4), with no single fleet allocated more than 2 of the pool — never the sum of the per-fleet governors, and imposed by passing each lane its allocation as --concurrency'
      required: false
    - name: --max-fleets
      description: 'Cap on how many fleets a single run schedules (default: 6); the shed is structural — the CI trust gate and the terminal lander are never shed, the independent quality sweeps are shed first at lowest queue depth first, and a spine member drops only if the human trims it — and every shed fleet is reported with its reason'
      required: false
    - name: --wall-clock
      description: 'Wall-clock budget for the run (default: 8h), compared against the run start timestamp at each wave boundary before the next wave is scheduled; exhausting it stops scheduling new lanes and reports partial results rather than killing in-flight work'
      required: false
    - name: --report-only
      description: Non-interactive — probe the queues, derive the DAG and the contention map, print the run plan, and stop; no CONFIRM is presented and no lane is dispatched, which makes this the gate-free path safe to call from tooling
      required: false
    - name: --dry-run
      description: Run SELECT and CONFIRM; stop before any lane is dispatched. Unlike --report-only this presents the run-plan gate, so it is not a gate-free path
      required: false
mcp:
  tool: run_skill
  input:
    skill: fleet-command
    path: string
type: rigid
tier: 2
phases:
  - name: select
    description: Determine which fleet members are installed, probe each one's queue depth through its own gate-free report-only path rather than reimplementing its selection and never through a gated dry-run path that would fire that member's own CONFIRM during selection, record a member with no gate-free path as queue-depth-unknown and carry it to the confirm round instead of guessing, drop empty-queue fleets as unscheduled rather than running them, derive the wave assignment from the fixed dependency shape with the CI trust gate first and ideation in its own wave ahead of intake and the independent quality sweeps parallel alongside intake and the land stage terminal so that no wave contains a dependency edge, apply the fleet cap structurally so the trust gate and the terminal lander are never shed, build the contention map over the four collision classes and the derived merge-order plan it implies, detect the run-level forks worth surfacing including an untrustworthy CI signal read from the CI member's own queue probe, and degrade the DAG to the members actually present while recording every member that is missing
    required: true
  - name: confirm
    description: Present the wave DAG, the fleet selection with its probed queue depths and its unknown-depth fleets and its unscheduled empty-queue fleets and everything the cap shed with the structural reason that shed it, the global budget of slots and the per-fleet sub-cap of 2 and one pass per fleet and the fleet cap and the wall-clock, the contention map with its serialization and merge-order consequences, and the detected forks with recommended defaults — including the CI trust fork whose options are to run the CI member alone this session or proceed with every downstream verdict labelled degraded or trim the fleets that lean hardest on the CI signal — together in one surface for a single run-plan authorization in which the human approves or trims fleets or re-tunes the budget once and trimming re-derives the DAG; this phase does not run at all under report-only
    required: true
  - name: dispatch
    description: Schedule one worktree-isolated lane per scheduled fleet wave by wave, each lane running the real member skill rather than a reimplementation of it and each dispatched with an explicit --concurrency set to its allocation from the global pool because that flag is the only seam the global cap has and a lane launched without it silently reverts to the member's own single-fleet default, admitting a lane to its fan-out phase only as a global slot frees and never co-scheduling a serialized pair and shedding rather than deferring any lane whose deferral would reach the terminal lander's wave, presenting each wave's ready fleets' own CONFIRM gates together in one batched round verbatim and unmodified, parking a lane that hits an unforeseen run-level fork while the other lanes continue, and comparing elapsed time against the wall-clock deadline at each wave boundary before scheduling the next wave so budget exhaustion stops new scheduling without killing in-flight lanes
    required: true
  - name: verify
    description: Confirm each lane from its emitted artifacts rather than its self-report — the terminal artifact exists in the form that member's contract specifies, per-item verdicts are present with the references they were drawn from and those references are independently spot-checked, and nothing was merged outside a human-authorized land inside the land member's own gate which is checked directly against every branch and PR the lanes touched — while staying within allocation is reported honestly as a dispatch-time-enforced property recorded as an assumption rather than as a verified check because no artifact records a lane's peak concurrency, and all-OS CI is recorded as not-applicable at this tier with its reason and never dropped silently
    required: true
  - name: report
    description: Emit one consolidated dashboard carrying a per-lane row with its wave and verdict and emissions and slot usage and parked forks, the cross-fleet-deduped filing list in which one defect raised by several sweeps becomes one row citing every lane that raised it, the recommended merge order with its regeneration sequence as advice rather than an action, the run's budget accounting, everything the budget shed named with its reason, and an assumptions-made note; never merge and never authorize a land
    required: true
state:
  persistent: false
  files: []
depends_on:
  - ideate-fleet
  - issue-fleet
  - adr-fleet
  - roadmap-fleet
  - pr-fleet
  - cicd-fleet
  - test-fleet
  - security-fleet
  - cleanup-fleet
  - bug-fleet
  - craft-fleet
addresses:
  - signal: backlog-pressure
    weight: 0.4
  - signal: drift
    weight: 0.2
capabilities:
  tools:
    - Bash
    - Read
    - Glob
    - Grep
  network: false
  filesystem: read-write
