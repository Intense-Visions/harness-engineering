name: harness-code-review
version: "2.0.0"
description: Multi-phase code review pipeline with mechanical checks, graph-scoped context, and parallel review agents
stability: static
cognitive_mode: adversarial-reviewer
triggers:
  - manual
  - on_pr
  - on_review
platforms:
  - claude-code
  - gemini-cli
  - cursor
  - codex
tools:
  - Bash
  - Read
  - Write
  - Glob
  - Grep
  - emit_interaction
cli:
  command: harness skill run harness-code-review
  args:
    - name: path
      description: Project root path
      required: false
    - name: --comment
      description: Post inline comments to GitHub PR
      required: false
    - name: --deep
      description: Add threat modeling pass (invokes security-review --deep)
      required: false
    - name: --no-mechanical
      description: Skip mechanical checks (useful if already run)
      required: false
    - name: --ci
      description: Enable eligibility gate, non-interactive output
      required: false
    - name: --fast
      description: Reduced rigor — skip learnings integration, fast-tier agents only
      required: false
    - name: --thorough
      description: Maximum rigor — always load learnings, full agent roster + meta-judge
      required: false
    - name: --depth
      description: "Override Phase 3.5 depth calibration: quick|standard|deep. 'deep' activates all conditional subagents (adversarial, typescript-strict, frontend-races)."
      required: false
    - name: session-slug
      description: Session slug for scoped state/handoff (passed by autopilot)
      required: false
    - name: commit-range
      description: "Git commit range for diff scope (e.g., abc123..HEAD)"
      required: false
    - name: review-dir
      description: "Review directory named by a dispatching session. When set, this run writes only its findings file there; the dispatching session writes the receipt and gates it"
      required: false
    - name: moment
      description: "Which review this is, named with review-dir: phase or final (a direct run is standalone)"
      required: false
    - name: reviewer
      description: "Reviewer id, named with review-dir: compliance-bug for the one reviewer of a light review, or one domain of a full review (compliance, bug, security, architecture, adversarial, typescript-strict, frontend-races). It names the findings file to write"
      required: false
    - name: head
      description: "The reviewed commit as a 40-character sha, named with review-dir; written as head in the findings file"
      required: false
mcp:
  tool: run_skill
  input:
    skill: harness-code-review
    path: string
type: rigid
tier: 2
catalog_tier: 0
state:
  # Not persistent: nothing is loaded back into a later run. The files are what a run writes:
  # a receipt and one findings file per reviewer.
  persistent: false
  files:
    - .harness/reviews/*/*.json
    - .harness/sessions/*/reviews/*/*.json
depends_on: []
addresses:
  - signal: high-complexity
    weight: 0.5
  - signal: high-coupling
    weight: 0.4
capabilities:
  tools:
    - Bash
    - Read
    - Write
    - Glob
    - Grep
    - emit_interaction
  network: false
  filesystem: read-write
