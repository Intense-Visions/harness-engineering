name: harness-initialize-project
version: "1.0.0"
description: Scaffold a new harness-compliant project, including design system and roadmap configuration
stability: static
cognitive_mode: constructive-architect
triggers:
  - manual
  - on_project_init
platforms:
  - claude-code
  - gemini-cli
  - cursor
  - codex
tools:
  - Bash
  - Read
  - Write
  - Glob
cli:
  command: harness skill run harness-initialize-project
  args:
    - name: path
      description: Project root path
      required: false
mcp:
  tool: run_skill
  input:
    skill: harness-initialize-project
    path: string
type: flexible
tier: 1
catalog_tier: 0
state:
  persistent: false
  files: []
depends_on:
  - initialize-test-suite-project
  - harness-design-system
  - harness-roadmap
capabilities:
  tools:
    - Bash
    - Read
    - Write
    - Glob
  network: false
  filesystem: read-write
