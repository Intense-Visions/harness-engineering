name: harness-offboarding
version: "1.0.0"
description: Offboard a departing developer from a harness-managed project
stability: static
cognitive_mode: advisory-guide
triggers:
  - manual
platforms:
  - claude-code
  - gemini-cli
  - cursor
  - codex
tools:
  - Bash
  - Read
  - Glob
  - Write
cli:
  command: harness skill run harness-offboarding
