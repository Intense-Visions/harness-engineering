name: ideate-fleet
version: '1.0.0'
description: Strategy-grounded ideation fan-out at the head of the fleet spine — derive a queue of disjoint themes from STRATEGY.md tracks and supplied opportunity areas, confirm the batch once, fan out worktree-isolated subagents that each run the real harness-ideate pipeline for one theme to its ranked artifact, collect every artifact verbatim out of its worktree, verify by artifact provenance plus an independently re-derived ranking rather than a self-report, and hand back one curated ranked shortlist for a human to pick from. Files nothing — no issue, roadmap row, spec, plan, ADR, or PR — and commits, stages, and pushes nothing.
stability: static
cognitive_mode: systematic-orchestrator
triggers:
  - manual
platforms:
  - claude-code
  - codex
  - cursor
  - gemini-cli
tools:
  - Bash
  - Read
  - Glob
  - Grep
cli:
  command: harness skill run ideate-fleet
  args:
    - name: path
      description: Project root path
      required: false
    - name: --themes
      description: Opportunity areas to fold into the theme queue alongside the STRATEGY.md tracks
      required: false
    - name: --count
      description: "Candidate ideas requested per theme (default: 10, clamped to harness-ideate's [5, 25])"
      required: false
    - name: --cut
      description: 'Per-theme shortlist cut — how many candidates each theme may promote (default: 3)'
      required: false
    - name: --cap
      description: 'Global shortlist cap across all themes (default: 10, resolved by the reserved-slot rule)'
      required: false
    - name: --concurrency
      description: 'Cap on concurrent ideation subagents (default: 2, max recommended 3 — the machine-storm limit)'
      required: false
    - name: --lookback
      description: 'Novelty cross-check window for recently-merged PRs, in days (default: 90)'
      required: false
    - name: --dry-run
      description: Run SELECT and CONFIRM only; do not fan out, verify, or write a shortlist
      required: false
mcp:
  tool: run_skill
  input:
    skill: ideate-fleet
    path: string
type: rigid
tier: 2
phases:
  - name: select
    description: Compose the STRATEGY.md tracks and any supplied opportunity areas into a bounded queue of disjoint themes, merging any overlapping pair, and score and order them by strategic weight; stop and report when there is no theme source at all
    required: true
  - name: confirm
    description: Present the ranked themes with their strategic basis and any disjointness merges, the per-theme candidate count, the objection policy, the per-theme cut and global cap, the novelty lookback window, the pinned UTC batch date, and the proposed concurrency for a single up-front human approval that also restates that nothing will be filed or committed
    required: true
  - name: dispatch
    description: Fan out worktree-isolated subagents, each running the real harness-ideate pipeline for one theme to its ranked artifact with the interactive stops answered from confirmed policy, then preselecting its top candidates, cross-checking each for novelty against open issues, roadmap rows, and recently-merged PRs with backfill, and collecting the artifact verbatim into the invoking tree before its worktree is released
    required: true
  - name: verify
    description: Independently resolve each collected artifact by its frontmatter topic, confirm the mandated frontmatter, count semantics, and per-candidate fields, and recompute every base score from the artifact's own inputs to confirm score equality, non-increasing final-score order, and a bounded strategy-alignment tiebreaker — never by subagent self-report, and recording all-OS CI as not applicable to this member
    required: true
  - name: curate-and-report
    description: Run the cross-theme dedup backstop, apply the bounded cut with its reserved-slot rule, write one curated ranked shortlist for the human to pick from, and report every non-shortlisted outcome with its reason — already-known drops with citations, novelty-unknown annotations, backfills, dedup collapses, below-cut counts, thin themes, parked themes, and rejected themes
    required: true
state:
  persistent: false
  files: []
depends_on:
  - harness-ideate
  - harness-strategy
  - harness-roadmap-pilot
  - harness-brainstorming
capabilities:
  tools:
    - Bash
    - Read
    - Glob
    - Grep
  network: false
  filesystem: read-write
