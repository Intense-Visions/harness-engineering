name: issue-fleet
version: '1.0.0'
description: Autonomous open-issue-backlog intake orchestrator — enumerate the open-issue queue, triage each issue (label, dedup, route, prioritize), confirm the destructive closes with the human in one up-front round, fan out concurrency-governed triage subagents over queue slices, independently re-derive every mutation from the issue's own signals, and hand the downstream fleets a clean, ranked, deduped, routed queue. Never silently closes an issue.
stability: static
cognitive_mode: systematic-orchestrator
triggers:
  - manual
platforms:
  - claude-code
  - codex
  - cursor
  - gemini-cli
tools:
  - Bash
  - Read
  - Glob
  - Grep
cli:
  command: harness skill run issue-fleet
  args:
    - name: path
      description: Project root path
      required: false
    - name: --concurrency
      description: 'Cap on concurrent triage subagents (default: 2, max recommended 3 — the machine-storm limit)'
      required: false
    - name: --report-only
      description: Enumerate and triage the queue and present the ranked batch; do not apply labels, close duplicates, or emit the routed queue
      required: false
    - name: --dry-run
      description: Run SELECT and CONFIRM only; do not fan out, verify, or apply any mutation
      required: false
mcp:
  tool: run_skill
  input:
    skill: issue-fleet
    path: string
type: rigid
tier: 2
phases:
  - name: select
    description: Enumerate the open-issue backlog, extract each issue's signals, compute an initial label/dedup/route/prioritize triage, snapshot the full queue for cross-slice dedup, and detect routing forks
    required: true
  - name: confirm
    description: Present the triaged queue in one round — duplicates flagged for closure with citations, routes, ranked order, forks as questions, proposed concurrency — for a single up-front human approval that carries the destructive-close authorization
    required: true
  - name: dispatch
    description: Partition the backlog into disjoint slices and fan out concurrency-governed triage subagents that finalize label/dedup/route/prioritize against the shared dedup snapshot, capped at the concurrency governor
    required: true
  - name: verify
    description: Independently re-derive every proposed mutation (each label, dedup close, and route) from the issue's own signals and confirm each authorized close is a genuine duplicate with a real citation — never by subagent self-report
    required: true
  - name: report
    description: Apply verified labels/routes, close only human-authorized and verified duplicates with canonical citations, emit the ranked/routed queue grouped by downstream fleet plus a one-row-per-issue batch summary, and never close an unauthorized or unverified issue
    required: true
state:
  persistent: false
  files: []
depends_on:
  - harness-roadmap-pilot
addresses:
  - signal: backlog-pressure
    weight: 0.5
  - signal: drift
    weight: 0.2
capabilities:
  tools:
    - Bash
    - Read
    - Glob
    - Grep
  network: false
  filesystem: read-write
