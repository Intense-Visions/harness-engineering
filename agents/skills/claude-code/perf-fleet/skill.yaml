name: perf-fleet
version: '1.0.0'
description: Autonomous performance-budget/regression remediation sweep — enumerate the perf-budget-violation and runtime-regression backlog by composing the existing perf detectors (check_performance, harness-perf, benchmark baselines), fold it into independent remediation targets, rank them by severity value, confirm the batch once, fan out worktree-isolated subagents that each run the real per-target measure-remediate-remeasure pipeline gated by a measured before/after, independently verify each result by a re-measurement that proves the budget is met plus updated baselines plus all-OS CI, and hand back a tiered batch of perf-fix PRs and filed redesign issues for one bulk human review. No measured before/after, no fix. Never auto-merges and never rebaselines a regression away.
stability: static
cognitive_mode: systematic-orchestrator
triggers:
  - manual
platforms:
  - claude-code
  - codex
  - cursor
  - gemini-cli
tools:
  - Bash
  - Read
  - Glob
  - Grep
cli:
  command: harness skill run perf-fleet
  args:
    - name: path
      description: Project root path
      required: false
    - name: --concurrency
      description: 'Cap on concurrent remediation subagents (default: 2, max recommended 3 — the machine-storm limit)'
      required: false
    - name: --report-only
      description: Enumerate, score, and present the ranked target batch without dispatching remediation subagents
      required: false
    - name: --dry-run
      description: Run SELECT and CONFIRM only; do not fan out, verify, or open PRs
      required: false
    - name: --safe-only
      description: Restrict remediation to the safe fix class (file the risky redesigns as issues) even if a target's risky optimization looks mechanical
      required: false
mcp:
  tool: run_skill
  input:
    skill: perf-fleet
    path: string
type: rigid
tier: 2
phases:
  - name: select
    description: Enumerate the perf-budget-violation and runtime-regression backlog by composing check_performance, harness check-perf (structural + coupling), the benchmark regression detector against get_perf_baselines, and a churn pass into remediation targets, cross-check against merged/open PRs, classify safe vs risky, and score by composite tier-severity x critical-path x churn
    required: true
  - name: confirm
    description: Present the ranked target batch in one round — already-optimized targets flagged for drop, safe/risky classifications confirmed, risky redesigns flagged as will-file, proposed concurrency — for a single up-front human approval
    required: true
  - name: dispatch
    description: Fan out worktree-isolated subagents, each running the real per-target measure-remediate-remeasure pipeline (harness-perf establishes the before, harness-debugging or harness-refactoring drives the fix, harness-perf re-measures the after) capped at the concurrency governor and consulting the per-leaf context budget; a target needing a risky redesign files an issue with its measurement evidence rather than auto-applying
    required: true
  - name: verify
    description: Independently confirm each returned branch cleared the measured before/after bar (the target opened with a measured violation and a re-measurement proves the budget is met), that baselines were updated via update_perf_baselines rather than hand-edited to mask the regression, and that CI is green across all target operating systems plus the project's required checks against a fresh base — never by subagent self-report
    required: true
  - name: report
    description: Emit a one-row-per-target tiered batch summary — verified fix PRs with before/after numbers and assumptions notes, plus filed redesign issues carrying the measurement evidence — for bulk human review, annotate already-optimized targets citing the resolving PR, never merge
    required: true
state:
  persistent: false
  files: []
depends_on:
  - harness-perf
  - harness-debugging
  - harness-refactoring
  - harness-roadmap-pilot
addresses:
  - signal: perf-regression
    weight: 0.7
  - signal: high-complexity
    weight: 0.4
capabilities:
  tools:
    - Bash
    - Read
    - Glob
    - Grep
  network: false
  filesystem: read-write
