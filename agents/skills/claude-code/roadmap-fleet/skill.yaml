name: roadmap-fleet
version: '1.0.0'
description: Autonomous batch-build orchestrator — score and confirm a batch of backlog candidates, fan out worktree-isolated subagents that run the real per-item pipeline, independently verify each result by artifact and all-OS CI, and hand back a batch of merge-ready PRs for one bulk human review. Never auto-merges.
stability: static
cognitive_mode: systematic-orchestrator
triggers:
  - manual
platforms:
  - claude-code
  - codex
  - cursor
  - gemini-cli
tools:
  - Bash
  - Read
  - Glob
  - Grep
cli:
  command: harness skill run roadmap-fleet
  args:
    - name: path
      description: Project root path
      required: false
    - name: --concurrency
      description: 'Cap on concurrent build subagents (default: 2, max recommended 3 — the machine-storm limit)'
      required: false
    - name: --report-only
      description: Enumerate, score, and present the ranked batch without dispatching build subagents
      required: false
    - name: --dry-run
      description: Run SELECT and CONFIRM only; do not fan out, verify, or report
      required: false
mcp:
  tool: run_skill
  input:
    skill: roadmap-fleet
    path: string
type: rigid
tier: 2
phases:
  - name: select
    description: Enumerate candidates (open issues + unblocked roadmap shards), cross-check against merged/open PRs, score and order via roadmap-pilot impact scoring
    required: true
  - name: confirm
    description: Present the ranked batch in one round — resolved items flagged for closure, decision forks as questions, proposed concurrency — for a single up-front human approval
    required: true
  - name: dispatch
    description: Fan out worktree-isolated subagents, each running the real brainstorming then autopilot pipeline for one item, capped at the concurrency governor
    required: true
  - name: verify
    description: Independently confirm each returned branch has a plan artifact plus autopilot-state and is CI-green across all OS plus enforce and harness — never by subagent self-report
    required: true
  - name: report
    description: Emit a one-row-per-item batch summary with assumptions notes for bulk human review, close already-resolved issues citing the resolving PR, never merge
    required: true
state:
  persistent: false
  files: []
depends_on:
  - harness-roadmap-pilot
  - harness-brainstorming
  - harness-autopilot
  - harness-code-review
addresses:
  - signal: backlog-pressure
    weight: 0.5
  - signal: drift
    weight: 0.2
capabilities:
  tools:
    - Bash
    - Read
    - Glob
    - Grep
  network: false
  filesystem: read-write
