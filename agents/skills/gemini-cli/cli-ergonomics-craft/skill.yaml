name: cli-ergonomics-craft
version: "0.1.0"
description: LLM-judgment critique of command-line ergonomics quality — the ceiling counterpart to mechanical CLI checks, and the one craft skill with no rule-based floor twin. Asks whether command and flag names are predictable and consistent, whether help text is task-oriented, whether errors are actionable, whether defaults are sane and safe, whether output is scannable and terminal-aware, whether the CLI composes (pipeable, machine-readable, honest exit codes), and whether destructive actions are guarded. Structural twin of harness-docs-craft.
stability: draft
cognitive_mode: constructive-architect
triggers:
  - manual
  - on_pr
  - on_new_feature
platforms:
  - claude-code
tools:
  - Bash
  - Read
  - Glob
  - Grep
cli:
  command: harness cli-ergonomics-craft
  args:
    - name: path
      description: Project root path
      required: false
    - name: files
      description: Optional file scope (overrides command discovery)
      required: false
    - name: commands-dir
      description: Directory of command definitions to critique
      required: false
    - name: exclude-dirs
      description: Extra subdir names to skip while walking
      required: false
    - name: max-files
      description: Cap command count (default 60)
      required: false
mcp:
  tool: cli_ergonomics_craft
  input:
    path: string
type: rigid
tier: 2
phases:
  - name: discover
    description: Walk command source roots; classify each command as leaf or group; exclude tests, barrels, and build dirs
    required: true
  - name: critique
    description: LLM-rubric loop per (command, rubric) filtered by command kind — 7 seed rubrics
    required: true
  - name: report
    description: Aggregate findings + rubric/exemplar catalog + cost telemetry + command counts
    required: true
state:
  persistent: false
depends_on:
  - docs-craft
