# Load-bearing-minimum tier: the two agent-loop gates that keep quality holding
# when the senior is away — multi-persona review and the outcome-eval ship gate.
# Scaffolded verbatim by `harness init --level load-bearing-minimum`.
#
# Both jobs run `pull_request` against `main`. Edit `branches:` if your default
# branch differs, and `--block-on` to change the severity that fails the check.
# The heuristic floor of both gates runs on any runner; the LLM tier activates
# only when an API-key secret is present, degrading gracefully otherwise.
name: Required Review

on:
  pull_request:
    branches: [main]

# Least privilege: both gates only read the diff today.
permissions:
  contents: read

jobs:
  required-review:
    name: required-review
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HARNESS_LOCAL_ENDPOINT: ${{ secrets.HARNESS_LOCAL_ENDPOINT }}
      HARNESS_LOCAL_MODEL: ${{ secrets.HARNESS_LOCAL_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the PR base branch is reachable for the diff range.
          fetch-depth: 0
      - name: Fetch PR base branch
        run: git fetch origin ${{ github.base_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @harness-engineering/cli
      - name: Multi-persona review gate
        run: harness review-ci --runner claude --block-on request-changes --diff "origin/${{ github.base_ref }}...HEAD"

  outcome-eval:
    name: outcome-eval
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HARNESS_LOCAL_ENDPOINT: ${{ secrets.HARNESS_LOCAL_ENDPOINT }}
      HARNESS_LOCAL_MODEL: ${{ secrets.HARNESS_LOCAL_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch PR base branch
        run: git fetch origin ${{ github.base_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @harness-engineering/cli
      - name: Outcome-eval ship gate
        # Judges the change against its spec; blocks only on a high-confidence
        # NOT_SATISFIED. Auto-discovers the spec from the diff.
        run: harness outcome-eval-ci --block-on blocking --diff "origin/${{ github.base_ref }}...HEAD"
